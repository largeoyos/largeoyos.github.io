baseURL: /
relativeURLs: true
title: LarGeoYos | Personal Homepage
defaultContentLanguage: en
locale: zh-CN
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: node_modules/flag-icons/flags
      target: static/flags
    - source: node_modules/@fontsource/mulish/files
      target: static/files
    - source: node_modules/katex/dist/fonts
      target: static/fonts
outputs:
  home: [HTML, RSS, JSON]
params:
  topNavbar:
    maxVisibleSections: 5
  features:
    portfolio:
      enable: true
    blog:
      enable: false
    notes:
      enable: false
    theme:
      enable: true
      services:
        light: true
        dark: false
        default: light
