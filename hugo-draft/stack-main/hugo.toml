baseURL = 'https://largeoyos.github.io/'
relativeURLs = false
disablePathToLower = true
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'LarGeoYos'
hasCJKLanguage = true
summaryLength = 65
enableRobotsTXT = false

[pagination]
pagerSize = 5

[taxonomies]
category = 'categories'

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false

[security]
# These HTML documents and application scripts are generated from this repository.
allowContent = ['^text/html$', '^text/markdown$']

[params]
description = '学习笔记、技术备忘，以及好用的工具和有趣的游戏。'
mainSections = ['post']
favicon = 'site-logo.svg'

[params.sidebar]
subtitle = 'USTC Undergraduate | Computer Science Enthusiast'
avatar = 'site-logo.svg'

[params.footer]
since = 2026
customText = '❤️ Version 5.0.0-preview.4'

[params.dateFormat]
published = '2006-01-02'
lastUpdated = '2006-01-02'

[params.article]
toc = true
readingTime = false
headingAnchor = true
[params.article.license]
enabled = false

[params.colorScheme]
toggle = true
default = 'light'

[params.comments]
enabled = false

[[params.widgets.homepage]]
type = 'search'
[[params.widgets.homepage]]
type = 'archives'
[params.widgets.homepage.params]
limit = 3
[[params.widgets.homepage]]
type = 'categories'
[params.widgets.homepage.params]
limit = 10
[[params.widgets.page]]
type = 'toc'

[[menu.main]]
identifier = 'home'
name = '🏠 工作主页'
pageRef = '/'
weight = 10
