[[module.imports]]
path = 'github.com/CaiJimmy/hugo-theme-stack/v4'

[[module.mounts]]
source = 'content'
target = 'content'
files = ['page/**', 'post/**']
[[module.mounts]]
source = 'generated-content'
target = 'content'
[[module.mounts]]
source = 'generated-site/content'
target = 'content'
[[module.mounts]]
source = 'generated-site/static'
target = 'static'
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = '../../assets/favicon.svg'
target = 'assets/site-logo.svg'
[[module.mounts]]
source = 'layouts'
target = 'layouts'
[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
source = '../../.nojekyll'
