<script>window.StackSiteBase = {{ site.Home.RelPermalink }};</script>
<script>
    (function () {
        var available = ['coast', 'forest', 'sand', 'plum', 'slate'];
        var saved = '';
        try { saved = localStorage.getItem('StackPalette') || ''; } catch (_) {}
        document.documentElement.dataset.palette = available.includes(saved) ? saved : 'coast';
    })();
</script>
<script src="{{ "stack-site/runtime.js" | relURL }}"></script>
<script defer src="{{ "stack-site/palette.js" | relURL }}"></script>
<link rel="stylesheet" href="{{ "stack-site/interface.css" | relURL }}?v=5.0.0-preview.6">
{{ if .Params.sourceMarkdown }}
<script>window.StackArticle = {{ dict "source" .Params.sourceMarkdown "previous" .Params.originalPrev "next" .Params.originalNext }};</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="{{ "js/article-math.js" | relURL }}"></script>
<link rel="stylesheet" href="{{ "tutorials/output/tutorial-collection/math/katex.min.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/article-math.css" | relURL }}">
<script defer src="{{ "tutorials/output/tutorial-collection/math/katex.min.js" | relURL }}"></script>
<script defer src="{{ "tutorials/output/tutorial-collection/math/render.js" | relURL }}"></script>
<script defer src="{{ "stack-site/reader.js" | relURL }}"></script>
{{ end }}
