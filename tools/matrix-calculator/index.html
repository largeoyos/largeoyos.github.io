<script>
(function() {
    'use strict';

    if (typeof nerdamer === 'undefined') {
        document.getElementById('resultContent').innerHTML =
            '<span class="mc-error">nerdamer 符号计算库加载失败，请刷新页面重试。</span>';
        return;
    }

    // ======================== 数据 ========================
    // matrixStore[name] = [[string_expr, ...], ...] (2D 符号表达式数组)
    const matrixStore = {};
    let currentResult = null;
    let currentResultType = 'none'; // 'matrix' | 'dict' | 'string'
    let _numericNote = '';          // 数值模式提示文字

    // ======================== DOM 引用 ========================
    const $ = id => document.getElementById(id);
    const warehouseList = $('warehouseList');
    const selectA = $('selectA');
    const selectB = $('selectB');
    const resultContent = $('resultContent');
    const saveName = $('saveName');
    const defineModal = $('defineModal');
    const matrixName = $('matrixName');
    const matrixRows = $('matrixRows');
    const matrixCols = $('matrixCols');
    const matrixGrid = $('matrixGrid');

    // ======================== 符号工具函数 ========================
    // nerdamer 将 e/E 视为欧拉常数而非变量，此处做转义
    function escE(expr) {
        return expr.replace(/\be\b/g, '_e_').replace(/\bE\b/g, '_E_');
    }
    function unescE(expr) {
        return expr.replace(/_e_/g, 'e').replace(/_E_/g, 'E');
    }

    function isNumericExpr(expr) {
        try { return nerdamer(escE(expr)).variables().length === 0; } catch (e) { return false; }
    }

    function evalNumeric(expr) {
        try {
            const v = nerdamer(expr).evaluate().valueOf();
            return typeof v === 'number' ? v : null;
        } catch (e) { return null; }
    }

    // 精确模式：将原始表达式字符串转为 LaTeX，不经过 nerdamer 化简
    function exactToLatex(expr) {
        if (!expr || expr === '0' || expr === '1') return expr;
        let s = unescE(expr);

        // 1. 分数 — 避免将函数名（后接 '('）当作分母
        s = s.replace(/\(([^)]*)\)\/(\(([^)]*)\))/g, '\\frac{$1}{$3}');
        s = s.replace(/\(([^)]*)\)\/([a-zA-Z0-9]+)\b(?!\()/g, '\\frac{$1}{$2}');
        s = s.replace(/\b([a-zA-Z0-9]+)\/\(([^)]*)\)/g, '\\frac{$1}{$2}');
        s = s.replace(/\b([a-zA-Z0-9]+)\/([a-zA-Z0-9]+)\b(?!\()/g, '\\frac{$1}{$2}');

        // 2. 指数（先于常数替换，避免 \pi 等干扰 \w 匹配）
        s = s.replace(/\)\^\(([^)]*)\)/g, ')^{$1}');
        s = s.replace(/\)\^(\w+)/g, ')^{$1}');
        s = s.replace(/(\w+)\^\(([^)]*)\)/g, '$1^{$2}');
        s = s.replace(/(\w+)\^(\w+)/g, '$1^{$2}');

        // 3. 常数
        s = s.replace(/\bpi\b/g, '\\pi');
        // e 保持为 e（欧拉常数，nerdamer 也如此处理）

        // 4. sqrt 特殊处理：括号转花括号
        s = s.replace(/\bsqrt\(([^)]*)\)/g, '\\sqrt{$1}');

        // 5. 函数名
        s = s.replace(/\bsin\b/g, '\\sin');
        s = s.replace(/\bcos\b/g, '\\cos');
        s = s.replace(/\btan\b/g, '\\tan');
        s = s.replace(/\blog\b/g, '\\log');
        s = s.replace(/\bln\b/g, '\\ln');
        s = s.replace(/\bexp\b/g, '\\exp');

        // 6. 乘法
        s = s.replace(/\*/g, '\\cdot ');

        return s;
    }

    function formatCellVal(val, exact) {
        if (typeof val !== 'number') return String(val);
        if (!isFinite(val)) return val > 0 ? '\\infty' : '-\\infty';
        if (exact) {
            try {
                const f = math.fraction(val);
                const num = f.s * f.n;
                const den = f.d;
                if (den === 1) return String(num);
                return `\\frac{${num}}{${den}}`;
            } catch (e) { return val.toFixed(4); }
        }
        return val.toFixed(4);
    }

    function formatComplex(val, exact) {
        if (!val || typeof val !== 'object' || val.re === undefined) return formatCellVal(val, exact);
        const re = val.re || 0;
        const im = val.im || 0;
        if (Math.abs(im) < 1e-14) return formatCellVal(re, exact);
        if (Math.abs(re) < 1e-14) {
            const s = formatCellVal(im, exact);
            return im >= 0 ? s + 'i' : '-' + s + 'i';
        }
        const rs = formatCellVal(re, exact);
        const is = formatCellVal(Math.abs(im), exact);
        return im >= 0 ? rs + ' + ' + is + 'i' : rs + ' - ' + is + 'i';
    }

    function formatCell(expr, exact) {
        const displayExpr = unescE(expr);
        if (expr === '0') return '0';
        try {
            if (exact) {
                return exactToLatex(displayExpr);
            }
            const sym = nerdamer(expr);
            const vars = sym.variables();
            if (vars.length === 0) {
                const num = sym.evaluate().valueOf();
                if (typeof num === 'number' && isFinite(num)) return num.toFixed(4);
            }
            // 有变量时回退到精确显示
            return exactToLatex(displayExpr);
        } catch (e) {
            try { return nerdamer(expr).toTeX(); } catch (e2) { return displayExpr; }
        }
    }

    function matrixToLatex(data, exact) {
        if (!data || data.length === 0) return '';
        if (data instanceof math.Matrix || data.isMatrix) {
            return mathMatrixToLatex(data, exact);
        }
        const rows = data.map(row =>
            row.map(cell => formatCell(cell, exact)).join(' & ')
        ).join(' \\\\ ');
        return `\\begin{pmatrix} ${rows} \\end{pmatrix}`;
    }

    function mathMatrixToLatex(mat, exact) {
        if (!mat) return '';
        const arr = mat.toArray();
        if (!Array.isArray(arr[0])) {
            return `\\begin{pmatrix} ${arr.map(v => formatComplex(v, exact)).join(' & ')} \\end{pmatrix}`;
        }
        const rows = arr.map(row =>
            row.map(v => formatComplex(v, exact)).join(' & ')
        ).join(' \\\\ ');
        return `\\begin{pmatrix} ${rows} \\end{pmatrix}`;
    }

    function renderLatex(latex, container) {
        try {
            katex.render(latex, container, { displayMode: true, throwOnError: false });
        } catch (e) {
            container.textContent = '渲染错误: ' + e.message;
        }
    }

    function getDisplayMode() {
        return document.querySelector('input[name="displayMode"]:checked').value;
    }

    function isExact() { return getDisplayMode() === 'exact'; }

    // ======================== 符号矩阵运算 ========================
    function cloneData(data) {
        return data.map(row => [...row]);
    }

    function symAdd(A, B) {
        const result = [];
        for (let i = 0; i < A.length; i++) {
            result[i] = [];
            for (let j = 0; j < A[i].length; j++) {
                result[i][j] = nerdamer(`(${A[i][j]}) + (${B[i][j]})`).toString();
            }
        }
        return result;
    }

    function symMul(A, B) {
        const m = A.length, p = A[0].length, n = B[0].length;
        const result = [];
        for (let i = 0; i < m; i++) {
            result[i] = [];
            for (let j = 0; j < n; j++) {
                let sum = '0';
                for (let k = 0; k < p; k++) {
                    sum = nerdamer(`(${sum}) + (${A[i][k]}) * (${B[k][j]})`).toString();
                }
                result[i][j] = sum;
            }
        }
        return result;
    }

    function symTrans(A) {
        const rows = A.length, cols = A[0].length;
        const result = [];
        for (let j = 0; j < cols; j++) {
            result[j] = [];
            for (let i = 0; i < rows; i++) {
                result[j][i] = A[i][j];
            }
        }
        return result;
    }

    function getMinor(A, r, c) {
        return A.filter((_, i) => i !== r).map(row => row.filter((_, j) => j !== c));
    }

    function symDet(A) {
        const n = A.length;
        if (n === 1) return A[0][0];
        if (n === 2) {
            return nerdamer(`(${A[0][0]}) * (${A[1][1]}) - (${A[0][1]}) * (${A[1][0]})`).toString();
        }
        let det = '0';
        for (let j = 0; j < n; j++) {
            const minorDet = symDet(getMinor(A, 0, j));
            if (minorDet === '0') continue;
            const term = j % 2 === 0
                ? nerdamer(`(${A[0][j]}) * (${minorDet})`).toString()
                : nerdamer(`-(${A[0][j]}) * (${minorDet})`).toString();
            det = nerdamer(`(${det}) + (${term})`).expand().toString();
        }
        return det;
    }

    function symInv(A) {
        const n = A.length;
        if (n === 1) return [[nerdamer(`1/(${A[0][0]})`).toString()]];
        const det = symDet(A);
        if (det === '0') throw new Error('矩阵行列式为零，无法求逆');
        const adj = [];
        for (let i = 0; i < n; i++) {
            adj[i] = [];
            for (let j = 0; j < n; j++) {
                const minorDet = symDet(getMinor(A, j, i));
                adj[i][j] = (i + j) % 2 === 0
                    ? minorDet
                    : nerdamer(`-(${minorDet})`).expand().toString();
            }
        }
        const result = [];
        for (let i = 0; i < n; i++) {
            result[i] = [];
            for (let j = 0; j < n; j++) {
                result[i][j] = nerdamer(`(${adj[i][j]}) / (${det})`).toString();
            }
        }
        return result;
    }

    // ======================== 符号 LU 分解 (Gauss 消元) ========================
    function symLU(A) {
        const n = A.length;
        const L = Array.from({ length: n }, () => Array(n).fill('0'));
        const U = Array.from({ length: n }, () => Array(n).fill('0'));
        const M = cloneData(A);

        for (let k = 0; k < n; k++) {
            const pivot = nerdamer.simplify(M[k][k]).toString();
            if (pivot === '0') {
                throw new Error(`LU 分解失败：第 ${k + 1} 行主元为零。请尝试行置换或检查矩阵是否奇异。`);
            }
            for (let i = k; i < n; i++) U[k][i] = M[k][i];
            L[k][k] = '1';
            for (let i = k + 1; i < n; i++) {
                const factor = nerdamer(`(${M[i][k]}) / (${M[k][k]})`).toString();
                L[i][k] = factor;
                for (let j = k; j < n; j++) {
                    M[i][j] = nerdamer(`(${M[i][j]}) - (${factor}) * (${M[k][j]})`).expand().toString();
                }
            }
        }
        return { L, U };
    }

    // ======================== 符号 QR 分解 (Gram–Schmidt) ========================
    function symQR(A) {
        const m = A.length, n = A[0].length;
        if (n > 8) throw new Error('QR 分解矩阵过大，建议使用 8×8 以下的矩阵');

        const Q = Array.from({ length: m }, () => Array(n).fill('0'));
        const R = Array.from({ length: n }, () => Array(n).fill('0'));

        for (let j = 0; j < n; j++) {
            const v = [];
            for (let i = 0; i < m; i++) v.push(A[i][j]);

            for (let k = 0; k < j; k++) {
                let dot = '0';
                for (let i = 0; i < m; i++)
                    dot = nerdamer(`(${dot}) + (${Q[i][k]}) * (${A[i][j]})`).toString();
                R[k][j] = dot;
                for (let i = 0; i < m; i++)
                    v[i] = nerdamer(`(${v[i]}) - (${dot}) * (${Q[i][k]})`).expand().toString();
            }

            let normSq = '0';
            for (let i = 0; i < m; i++)
                normSq = nerdamer(`(${normSq}) + (${v[i]})^2`).expand().toString();

            const norm = nerdamer(`sqrt(${normSq})`).toString();
            R[j][j] = norm;

            for (let i = 0; i < m; i++)
                Q[i][j] = nerdamer(`(${v[i]}) / (${norm})`).toString();
        }
        return { Q, R };
    }

    // ======================== 符号 LDL^T 分解 ========================
    function symLDL(A) {
        const n = A.length;
        for (let i = 0; i < n; i++) {
            for (let j = 0; j < i; j++) {
                const diff = nerdamer.simplify(
                    nerdamer(`(${A[i][j]}) - (${A[j][i]})`).toString()
                ).toString();
                if (diff !== '0')
                    throw new Error('LDL 分解仅适用于对称矩阵（A[i][j] = A[j][i]）');
            }
        }

        const L = Array.from({ length: n }, () => Array(n).fill('0'));
        const D = Array.from({ length: n }, () => Array(n).fill('0'));

        for (let j = 0; j < n; j++) {
            let dSum = A[j][j];
            for (let k = 0; k < j; k++)
                dSum = nerdamer(`(${dSum}) - (${L[j][k]})^2 * (${D[k][k]})`).expand().toString();
            D[j][j] = dSum;

            L[j][j] = '1';

            for (let i = j + 1; i < n; i++) {
                let lSum = A[i][j];
                for (let k = 0; k < j; k++)
                    lSum = nerdamer(`(${lSum}) - (${L[i][k]}) * (${L[j][k]}) * (${D[k][k]})`).expand().toString();
                L[i][j] = nerdamer(`(${lSum}) / (${D[j][j]})`).toString();
            }
        }
        return { L, D };
    }

    // ======================== 符号特征值分解（2×2） ========================
    function symEigen2x2(A) {
        const a = A[0][0], b = A[0][1], c = A[1][0], d = A[1][1];
        const trace = nerdamer(`(${a}) + (${d})`).toString();
        const det = nerdamer(`(${a}) * (${d}) - (${b}) * (${c})`).toString();
        const disc = nerdamer(`(${trace})^2 - 4 * (${det})`).expand().toString();
        const sqrtDisc = nerdamer(`sqrt(${disc})`).toString();
        const λ1 = nerdamer(`((${trace}) + (${sqrtDisc})) / 2`).toString();
        const λ2 = nerdamer(`((${trace}) - (${sqrtDisc})) / 2`).toString();

        function eigenvec(λ) {
            const bChk = nerdamer.simplify(b).toString();
            if (bChk !== '0') {
                const y = nerdamer(`-(${a} - (${λ})) / (${b})`).toString();
                return ['1', y];
            }
            const cChk = nerdamer.simplify(c).toString();
            if (cChk !== '0') {
                const x = nerdamer(`-(${d} - (${λ})) / (${c})`).toString();
                return [x, '1'];
            }
            return ['1', '0'];
        }

        const v1 = eigenvec(λ1), v2 = eigenvec(λ2);
        return {
            'P (特征向量)': [[v1[0], v2[0]], [v1[1], v2[1]]],
            'D (特征值)': [[λ1, '0'], ['0', λ2]]
        };
    }

    // ======================== 符号特征多项式（任意方阵） ========================
    function symCharPoly(A) {
        const n = A.length;
        const B = A.map((row, i) => row.map((cell, j) => {
            if (i === j) return cell === '0' ? '-λ' : `(${cell}) - λ`;
            return cell;
        }));
        return symDet(B);
    }

    // ======================== 符号特征值提取（因式分解法） ========================
    function extractRoot(factorStr, varName) {
        try {
            const esc = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(esc, 'g');
            const val0 = nerdamer(factorStr.replace(re, '0')).toString();
            const val1 = nerdamer(factorStr.replace(re, '1')).toString();
            const coeff = nerdamer('(' + val1 + ') - (' + val0 + ')').toString();
            let root = nerdamer('-(' + val0 + ') / (' + coeff + ')').toString();
            try { root = nerdamer.simplify(root).toString(); } catch (e) {}
            return root;
        } catch (e) { return null; }
    }

    function symFactorEigen(A) {
        const poly = symCharPoly(A);
        try {
            const factored = nerdamer.factor(poly).toString();
            if (factored === poly) return null; // 无法因式分解
            const roots = [];
            const regex = /\(([^()]+)\)(?:\^\(?(\d+)\)?)?/g;
            let match;
            while ((match = regex.exec(factored)) !== null) {
                const factor = match[1].trim();
                const power = match[2] ? parseInt(match[2]) : 1;
                const root = extractRoot(factor, 'λ');
                if (root === null) return null;
                for (let p = 0; p < power; p++) roots.push(root);
            }
            if (roots.length !== A.length) return null;
            return { poly, factored, roots };
        } catch (e) { return null; }
    }

    // ======================== 数值分解 (math.js / numeric.js) ========================
    function dataToMathMatrix(data) {
        const arr = data.map(row =>
            row.map(cell => {
                const v = evalNumeric(cell);
                if (v === null) throw new Error(`无法将表达式 "${cell}" 转换为数值`);
                return v;
            })
        );
        return math.matrix(arr);
    }

    function tryNumericDecomp(mode, data) {
        const M = dataToMathMatrix(data);
        let dict;
        switch (mode) {
            case 'QR': {
                const { Q, R } = math.qr(M);
                dict = { Q, R };
                break;
            }
            case 'EIGEN': {
                const eig = math.eigs(M);
                const eVals = math.flatten(eig.values).valueOf();
                const nE = eVals.length;
                const DE = math.zeros(nE, nE);
                for (let i = 0; i < nE; i++) DE.set([i, i], eVals[i]);
                dict = { 'P (特征向量)': eig.vectors, 'D (特征值)': DE };
                break;
            }
            case 'SVD': {
                const arr = M.toArray();
                if (typeof numeric === 'undefined' || typeof numeric.svd !== 'function')
                    throw new Error('SVD 需要 numeric.js 库，但其未加载');
                const sv = numeric.svd(arr);
                const nS = sv.S.length;
                const S = math.zeros(nS, nS);
                for (let i = 0; i < nS; i++) S.set([i, i], sv.S[i]);
                dict = {
                    U: math.matrix(sv.U),
                    S,
                    V: math.matrix(sv.V)
                };
                break;
            }
            case 'LDL': {
                const arr = M.toArray();
                const n = arr.length;
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < i; j++) {
                        if (Math.abs(arr[i][j] - arr[j][i]) > 1e-12) {
                            throw new Error('LDL 分解仅适用于对称矩阵');
                        }
                    }
                }
                const L = math.identity(n).toArray();
                const D = math.zeros(n, n).toArray();
                for (let j = 0; j < n; j++) {
                    let sum = 0;
                    for (let k = 0; k < j; k++) sum += L[j][k] * L[j][k] * D[k][k];
                    D[j][j] = arr[j][j] - sum;
                    if (Math.abs(D[j][j]) < 1e-14) throw new Error('矩阵奇异，LDL 分解失败');
                    for (let i = j + 1; i < n; i++) {
                        sum = 0;
                        for (let k = 0; k < j; k++) sum += L[i][k] * L[j][k] * D[k][k];
                        L[i][j] = (arr[i][j] - sum) / D[j][j];
                    }
                }
                dict = { 'L (下三角)': math.matrix(L), 'D (对角型)': math.matrix(D) };
                break;
            }
        }
        return dict;
    }

    // ======================== 刷新仓库 & 选择框 ========================
    function refreshSelects() {
        const names = Object.keys(matrixStore);
        const aVal = selectA.value;
        const bVal = selectB.value;
        selectA.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
        selectB.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
        if (names.includes(aVal)) selectA.value = aVal;
        if (names.includes(bVal)) selectB.value = bVal;
    }

    function dataPreview(data) {
        try {
            return data.map(row =>
                row.map(c => {
                    const s = nerdamer(escE(c)).toString();
                    return unescE(s.length > 10 ? s.slice(0, 10) + '…' : s);
                }).join(' ')
            ).join(' \\\\ ');
        } catch (e) { return ''; }
    }

    function refreshWarehouse() {
        const names = Object.keys(matrixStore);
        warehouseList.innerHTML = names.map(n => {
            const data = matrixStore[n];
            const tip = data ? dataPreview(data) : '';
            return `<li data-name="${n}" title="${tip}" onclick="window._mcSelect('${n}')">${n}</li>`;
        }).join('');
        refreshSelects();
    }

    window._mcSelect = function(name) {
        const data = matrixStore[name];
        if (data) {
            currentResult = data;
            currentResultType = 'matrix';
            _numericNote = '';
            renderCurrentResult();
        }
        document.querySelectorAll('.mc-warehouse-list li').forEach(el => {
            el.classList.toggle('active', el.dataset.name === name);
        });
    };

    // ======================== 显示结果 ========================
    function renderCurrentResult() {
        const exact = isExact();
        if (currentResultType === 'matrix') {
            const latex = matrixToLatex(currentResult, exact);
            renderLatex(latex, resultContent);
        } else if (currentResultType === 'dict') {
            const parts = [];
            for (const [key, mat] of Object.entries(currentResult)) {
                const l = matrixToLatex(mat, exact);
                parts.push(`\\text{${key}} = ${l}`);
            }
            renderLatex(parts.join('\\quad'), resultContent);
        } else if (currentResultType === 'string') {
            resultContent.innerHTML = `<span class="mc-error">${currentResult}</span>`;
        } else {
            resultContent.innerHTML = '<span style="color:#6c7086;">定义矩阵后开始计算</span>';
        }
        if (_numericNote) {
            const note = document.createElement('div');
            note.style.cssText = 'color:#fab387;font-size:12px;margin-top:8px;text-align:center;';
            note.textContent = _numericNote;
            resultContent.appendChild(note);
        }
    }

    // ======================== 添加矩阵 ========================
    function addMatrix(name, data) {
        _numericNote = '';
        // 转义 e/E 为 _e_/_E_，使 nerdamer 将其视为变量而非欧拉常数
        matrixStore[name] = data.map(row => row.map(cell => escE(String(cell))));
        refreshWarehouse();
        currentResult = matrixStore[name];
        currentResultType = 'matrix';
        renderCurrentResult();
        document.querySelectorAll('.mc-warehouse-list li').forEach(el => {
            el.classList.toggle('active', el.dataset.name === name);
        });
    }

    // ======================== 运算入口 ========================
    function performOp(type) {
        const aName = selectA.value;
        const bName = selectB.value;
        if (!aName || !matrixStore[aName]) {
            resultContent.innerHTML = '<span class="mc-error">请先选择矩阵 A</span>';
            return;
        }
        const A = matrixStore[aName];
        _numericNote = '';
        try {
            let res;
            switch (type) {
                case 'add':
                    if (!bName || !matrixStore[bName]) throw new Error('请选择矩阵 B');
                    res = symAdd(A, matrixStore[bName]);
                    break;
                case 'mul':
                    if (!bName || !matrixStore[bName]) throw new Error('请选择矩阵 B');
                    res = symMul(A, matrixStore[bName]);
                    break;
                case 'inv':
                    if (A.length !== A[0].length) throw new Error('求逆需要方阵');
                    res = symInv(A);
                    break;
                case 'trans':
                    res = symTrans(A);
                    break;
            }
            currentResult = res;
            currentResultType = 'matrix';
            renderCurrentResult();
        } catch (e) {
            resultContent.innerHTML = `<span class="mc-error">${e.message || String(e)}</span>`;
        }
    }

    function performDecomp(mode) {
        const aName = selectA.value;
        if (!aName || !matrixStore[aName]) {
            resultContent.innerHTML = '<span class="mc-error">请先选择矩阵 A</span>';
            return;
        }
        const A = matrixStore[aName];
        _numericNote = '';

        try {
            // LU: 符号
            if (mode === 'LU') {
                if (A.length !== A[0].length) throw new Error('LU 分解需要方阵');
                const { L, U } = symLU(A);
                currentResult = { L, U };
                currentResultType = 'dict';
                renderCurrentResult();
                return;
            }

            // LDL: 符号
            if (mode === 'LDL') {
                if (A.length !== A[0].length) throw new Error('LDL 分解需要方阵');
                const { L, D } = symLDL(A);
                currentResult = { L, D };
                currentResultType = 'dict';
                renderCurrentResult();
                return;
            }

            // QR: 符号 Gram–Schmidt
            if (mode === 'QR') {
                const { Q, R } = symQR(A);
                currentResult = { Q, R };
                currentResultType = 'dict';
                renderCurrentResult();
                return;
            }

            // EIGEN: 2×2 符号，3×3+ 纯数值用 math.eigs，符号展示特征多项式
            if (mode === 'EIGEN') {
                if (A.length !== A[0].length) throw new Error('特征值分解需要方阵');

                if (A.length === 2) {
                    currentResult = symEigen2x2(A);
                    currentResultType = 'dict';
                    renderCurrentResult();
                    return;
                }

                // 3×3+：检查是否纯数值
                let allNumeric = true;
                for (const row of A)
                    for (const cell of row)
                        if (!isNumericExpr(cell)) { allNumeric = false; break; }

                if (allNumeric) {
                    const M = dataToMathMatrix(A);
                    const eig = math.eigs(M);
                    const eVals = math.flatten(eig.values).valueOf();
                    const nE = eVals.length;
                    const DE = math.zeros(nE, nE);
                    for (let i = 0; i < nE; i++) DE.set([i, i], eVals[i]);
                    currentResult = { 'P (特征向量)': eig.vectors, 'D (特征值)': DE };
                    currentResultType = 'dict';
                    _numericNote = '⚠ 大于 2×2 的矩阵使用 math.js 数值模式计算特征值';
                    renderCurrentResult();
                    return;
                }

                // 符号矩阵：尝试因式分解提取特征值
                const factorResult = symFactorEigen(A);
                if (factorResult) {
                    const { poly, factored, roots } = factorResult;
                    // 构建特征值对角矩阵 D
                    const nR = A.length;
                    const D = Array.from({ length: nR }, () => Array(nR).fill('0'));
                    for (let i = 0; i < nR; i++) D[i][i] = roots[i];
                    currentResult = { '特征多项式 (因式分解)': [[factored]], 'D (特征值)': D };
                    currentResultType = 'dict';
                    renderCurrentResult();
                    return;
                }

                // 无法因式分解：展示特征多项式
                const poly = symCharPoly(A);
                renderLatex('\\text{特征多项式:}\\quad \\det(A - \\lambda I) = ' + nerdamer(poly).toTeX(), resultContent);
                const note = document.createElement('div');
                note.style.cssText = 'color:#fab387;font-size:12px;margin-top:8px;text-align:center;';
                note.textContent = '⚠ 包含符号变量的矩阵大于 2×2 无法直接因式分解出特征值，仅展示特征多项式。';
                resultContent.appendChild(note);
                return;
            }

            // SVD: 数值兜底
            if (mode === 'SVD') {
                // 检查纯数值
                for (const row of A)
                    for (const cell of row)
                        if (!isNumericExpr(cell))
                            throw new Error('SVD 分解需要纯数值矩阵。表达式 "' + cell + '" 包含符号变量。');
                const dict = tryNumericDecomp('SVD', A);
                currentResult = dict;
                currentResultType = 'dict';
                _numericNote = '⚠ SVD 分解使用 numeric.js 数值模式计算';
                renderCurrentResult();
                return;
            }

            resultContent.innerHTML = '<span class="mc-error">未知的分解类型</span>';
        } catch (e) {
            resultContent.innerHTML = `<span class="mc-error">${e.message || String(e)}</span>`;
        }
    }

    // ======================== 保存 ========================
    function saveResult() {
        if (currentResultType !== 'matrix' || !Array.isArray(currentResult)) {
            resultContent.innerHTML = '<span class="mc-error">请确保当前结果是单个矩阵</span>';
            return;
        }
        const name = saveName.value.trim() || 'ANS';
        let finalName = name;
        if (matrixStore[name]) {
            let i = 1;
            while (matrixStore[name + '_' + i]) i++;
            finalName = name + '_' + i;
        }
        addMatrix(finalName, cloneData(currentResult));
        saveName.value = finalName;
    }

    // ======================== 模态框 ========================
    function buildGrid(rows, cols) {
        matrixGrid.innerHTML = '';
        for (let i = 0; i < rows; i++) {
            const tr = document.createElement('tr');
            for (let j = 0; j < cols; j++) {
                const td = document.createElement('td');
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.value = i === j ? '1' : '0';
                inp.dataset.r = i;
                inp.dataset.c = j;
                td.appendChild(inp);
                tr.appendChild(td);
            }
            matrixGrid.appendChild(tr);
        }
    }

    function readGrid() {
        const rows = parseInt(matrixRows.value);
        const cols = parseInt(matrixCols.value);
        const data = [];
        for (let i = 0; i < rows; i++) {
            const row = [];
            for (let j = 0; j < cols; j++) {
                const inp = matrixGrid.querySelector(`input[data-r="${i}"][data-c="${j}"]`);
                const raw = inp ? inp.value.trim() : '';
                row.push(raw === '' ? '0' : raw);
            }
            data.push(row);
        }
        return data;
    }

    function openDefineModal() {
        const existing = Object.keys(matrixStore).filter(n => /^[A-Z]$/.test(n));
        const used = new Set(existing);
        let suggested = '';
        for (let c = 65; c <= 90; c++) {
            if (!used.has(String.fromCharCode(c))) {
                suggested = String.fromCharCode(c);
                break;
            }
        }
        matrixName.value = suggested || 'M' + Object.keys(matrixStore).length;
        matrixRows.value = 3;
        matrixCols.value = 3;
        buildGrid(3, 3);
        defineModal.classList.add('show');
    }

    // ======================== 事件绑定 ========================
    document.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => performOp(btn.dataset.op));
    });

    document.querySelectorAll('[data-dec]').forEach(btn => {
        btn.addEventListener('click', () => performDecomp(btn.dataset.dec));
    });

    document.querySelectorAll('input[name="displayMode"]').forEach(rb => {
        rb.addEventListener('change', renderCurrentResult);
    });

    $('btnSave').addEventListener('click', saveResult);
    $('btnDefineMatrix').addEventListener('click', openDefineModal);

    $('btnResize').addEventListener('click', () => {
        const r = parseInt(matrixRows.value) || 3;
        const c = parseInt(matrixCols.value) || 3;
        const oldData = {};
        matrixGrid.querySelectorAll('input').forEach(inp => {
            oldData[inp.dataset.r + ',' + inp.dataset.c] = inp.value;
        });
        buildGrid(r, c);
        matrixGrid.querySelectorAll('input').forEach(inp => {
            const key = inp.dataset.r + ',' + inp.dataset.c;
            if (oldData[key] !== undefined) inp.value = oldData[key];
        });
    });

    $('btnIdentity').addEventListener('click', () => {
        const r = parseInt(matrixRows.value) || 3;
        const c = parseInt(matrixCols.value) || 3;
        buildGrid(r, c);
    });

    $('btnClearGrid').addEventListener('click', () => {
        matrixGrid.querySelectorAll('input').forEach(inp => { inp.value = ''; });
    });

    $('btnConfirmMatrix').addEventListener('click', () => {
        const name = matrixName.value.trim() || 'M';
        const matrix = readGrid();
        addMatrix(name, matrix);
        defineModal.classList.remove('show');
    });

    $('btnCancelModal').addEventListener('click', () => {
        defineModal.classList.remove('show');
    });

    defineModal.addEventListener('click', (e) => {
        if (e.target === defineModal) defineModal.classList.remove('show');
    });

    // ======================== 初始化 ========================
    addMatrix('A', [
        ['1', '0', '0'],
        ['0', '1', '0'],
        ['0', '0', '1']
    ]);
})();
</script>
