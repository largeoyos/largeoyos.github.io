<script>(()=>{const lessonHost=window.courseState("ecl-bicmos-principles");

  (()=>{const root=document.getElementById('ecl-bicmos-lesson'),svg=root.querySelector('svg');let s={kind:'ecl',a:0};function draw(){const w=root.clientWidth,p=d=>`<path class="wire" d="${d}"/>`,t=(x,y,z,c='',anc='start')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${anc}">${z}</text>`;root.querySelector('select').value=s.kind;const bt=root.querySelector('button');bt.textContent='A = '+s.a;bt.setAttribute('aria-pressed',String(!!s.a));svg.setAttribute('viewBox',`0 0 ${w} 393`);svg.setAttribute('height','393');svg.dataset.output=String(1-s.a);if(s.kind==='ecl'){const l=w*.29,r=w*.69,m=(l+r)/2;let z='';for(const [x,side] of [[l,'左'],[r,'右']])z+=p(`M ${x} 39 V 65 M ${x} 107 V 171 L ${x-18} 185 M ${x-18} 175 V 211 M ${x-18} 201 L ${x} 217 V 245 M ${x-8} 205 L ${x} 217 L ${x-2} 205`)+`<rect x="${x-6}" y="65" width="12" height="42" fill="var(--background)" stroke="var(--foreground)"/>`+t(x+12,90,'R','small')+t(x-11,161,side,'small');const on=s.a?l:r;svg.innerHTML=`<title>ECL 差分电流开关核心</title><desc>输入管与参考管共用发射极电流。基极电位更高的一侧导通更多，集电极电位降低。省略射极输出缓冲和基准源细节。</desc>${p(`M ${l} 39 H ${r} M ${l} 245 H ${r} M ${m} 245 V 273 M ${m} 315 V 339 M 12 193 H ${l-18} M ${r-18} 193 H ${m+8}`)}${z}<rect x="${m-6}" y="273" width="12" height="42" fill="var(--background)" stroke="var(--foreground)"/>${t(l-13,28,'0 V')}${t(12,180,s.a?'−0.92 V':'−1.75 V','small')}${t(m+3,180,'基准 −1.3 V','small')}${t(m-28,362,'−5.2 V')}${t(m+14,298,'Rₑ','small')}<path d="M ${on+14} 118 V 236 m -5 -7 l 5 7 l 5 -7" fill="none" stroke="var(--viz-series-1)" stroke-width="2.5"/>${t(12,389,s.a?'左支路电流增大；左集电极降低':'右支路电流增大；左集电极升高','small')}`;root.querySelector('[data-result]').textContent='图示电压取自课本例子；这里显示电流开关核心，集电极后面还有输出缓冲。';}else{const bw=Math.min(w-32,260),x=(w-bw)/2;svg.innerHTML=`<title>Bi-CMOS 功能结构</title><desc>输入连接 CMOS 逻辑，后面由双极型输出级给负载电容充放电。</desc>${t(w/2,29,'A = '+s.a,'','middle')}${p(`M ${w/2} 40 V 66 M ${w/2} 120 V 169 M ${w/2} 233 V 285`)}<rect x="${x}" y="66" width="${bw}" height="54" fill="var(--background)" stroke="var(--border)"/><rect x="${x}" y="169" width="${bw}" height="64" fill="var(--background)" stroke="var(--border)"/>${t(w/2,98,'CMOS 逻辑部分','','middle')}${t(w/2,197,'双极型输出级','','middle')}${t(w/2,219,s.a?'下管导通，吸收电流':'上管导通，提供电流','small','middle')}${p(`M ${w/2} 285 H ${w-28} V 312 M ${w-43} 312 H ${w-13} M ${w-43} 319 H ${w-13} M ${w-28} 319 V 347 M ${w-40} 347 H ${w-16} M ${w-35} 353 H ${w-21}`)}${t(w/2-38,279,'Y = '+(1-s.a))}${t(w-60,341,'Cₗ','small')}${t(12,385,s.a?'负载电容放电，输出低电平':'负载电容充电，输出高电平','small')}`;root.querySelector('[data-result]').textContent='这是反相器的功能结构图；与非门、或非门改变前面的 CMOS 逻辑部分。';}}
    function save(){lessonHost?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}function restore(v){const q=v?.privateContent;if(q&&['ecl','bi'].includes(q.kind))s={kind:q.kind,a:+q.a===1?1:0};draw();}root.querySelector('select').addEventListener('change',e=>{s.kind=e.target.value;draw();save();});root.querySelector('button').addEventListener('click',()=>{s.a=1-s.a;draw();save();});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});})();
  
})();</script>
