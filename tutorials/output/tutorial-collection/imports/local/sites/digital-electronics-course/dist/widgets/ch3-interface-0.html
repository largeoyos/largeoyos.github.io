<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch3-interface-0")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch3-interface-0",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script></head><body><div id="logic-interface-lesson">
<div class="viz-controls"><label class="form-label">连接方式<select class="form-select" data-case=""><option value="hc">74 TTL → 74HC</option><option value="hct">74 TTL → 74HCT</option><option value="reverse">74HC → 74 TTL</option><option value="up">1.8 V → 5 V，OD 接口</option><option value="down">5 V → 1.8 V，OD 接口</option></select></label></div>
<svg aria-label="驱动输出与接收输入电平的匹配" class="de-circuit" data-pass="false" height="385" role="img" viewbox="0 0 708 385"><title>输出保证值与输入要求值比较</title><desc>左为驱动门输出高低电平最差值，右为接收门所要求的高低电平界限。数值按本书相应表格取值。</desc><text class="" text-anchor="middle" x="177" y="28">74 TTL</text><text class="" text-anchor="middle" x="531" y="28">74HC</text><text class="small" text-anchor="middle" x="177" y="52">输出保证值</text><text class="small" text-anchor="middle" x="531" y="52">输入要求值</text><path class="wire" d="M 177 73 V 307 M 164 307 H 190 M 531 73 V 307 M 518 307 H 544"></path><path class="wire" d="M 166 203.8 H 188 M 166 289.8 H 188 M 520 171.55 H 542 M 520 248.95 H 542"></path><path d="M 188 203.8 L 520 171.55" fill="none" stroke="var(--viz-series-1)" stroke-width="2"></path><path class="wire" d="M 188 289.8 L 520 248.95"></path><text class="small" text-anchor="end" x="161" y="207.8">2.4 V</text><text class="small" text-anchor="end" x="161" y="293.8">0.4 V</text><text class="small" text-anchor="start" x="547" y="175.55">3.15 V</text><text class="small" text-anchor="start" x="547" y="252.95">1.35 V</text><text class="small" text-anchor="middle" x="177" y="330">0 V</text><text class="small" text-anchor="middle" x="531" y="330">0 V</text><text class="" text-anchor="start" x="12" y="363">高电平不匹配，不能保证直连</text></svg>
<div aria-live="polite" data-result="">高电平余量 -0.75 V；低电平余量 0.95 V（参数与本书表格条件对应）</div>
<style>
    #logic-interface-lesson .de-circuit{display:block;width:100%}
    #logic-interface-lesson .wire{fill:none;stroke:var(--foreground);stroke-width:1.5}
    #logic-interface-lesson svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}
    #logic-interface-lesson svg .small{font-size:calc(var(--font-size-base)*.857)}
  </style>
<script>(()=>{const lessonHost=window.courseState("logic-interface-levels");

  (()=>{const root=document.getElementById('logic-interface-lesson'),svg=root.querySelector('svg');let c='hc';const cases={hc:{oh:2.4,ol:.4,ih:3.15,il:1.35,driver:'74 TTL',load:'74HC'},hct:{oh:2.4,ol:.4,ih:2,il:.8,driver:'74 TTL',load:'74HCT'},reverse:{oh:4.4,ol:.33,ih:2,il:.8,driver:'74HC',load:'74 TTL'}};function draw(){const w=root.clientWidth,p=d=>`<path class="wire" d="${d}"/>`,t=(x,y,z,c='',anchor='start')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${anchor}">${z}</text>`;root.querySelector('select').value=c;svg.setAttribute('viewBox',`0 0 ${w} 385`);svg.setAttribute('height','385');if(cases[c]){const q=cases[c],l=w*.25,r=w*.75,y=v=>307-v*43,pass=q.oh>=q.ih&&q.ol<=q.il;svg.dataset.pass=String(pass);svg.innerHTML=`<title>输出保证值与输入要求值比较</title><desc>左为驱动门输出高低电平最差值，右为接收门所要求的高低电平界限。数值按本书相应表格取值。</desc>${t(l,28,q.driver,'','middle')}${t(r,28,q.load,'','middle')}${t(l,52,'输出保证值','small','middle')}${t(r,52,'输入要求值','small','middle')}${p(`M ${l} 73 V 307 M ${l-13} 307 H ${l+13} M ${r} 73 V 307 M ${r-13} 307 H ${r+13}`)}${p(`M ${l-11} ${y(q.oh)} H ${l+11} M ${l-11} ${y(q.ol)} H ${l+11} M ${r-11} ${y(q.ih)} H ${r+11} M ${r-11} ${y(q.il)} H ${r+11}`)}<path d="M ${l+11} ${y(q.oh)} L ${r-11} ${y(q.ih)}" fill="none" stroke="var(--viz-series-1)" stroke-width="2"/>${p(`M ${l+11} ${y(q.ol)} L ${r-11} ${y(q.il)}`)}${t(l-16,y(q.oh)+4,q.oh+' V','small','end')}${t(l-16,y(q.ol)+4,q.ol+' V','small','end')}${t(r+16,y(q.ih)+4,q.ih+' V','small')}${t(r+16,y(q.il)+4,q.il+' V','small')}${t(l,330,'0 V','small','middle')}${t(r,330,'0 V','small','middle')}${t(12,363,pass?'电压条件满足；继续检查电流':'高电平不匹配，不能保证直连')}`;root.querySelector('[data-result]').textContent=`高电平余量 ${(q.oh-q.ih).toFixed(2)} V；低电平余量 ${(q.il-q.ol).toFixed(2)} V（参数与本书表格条件对应）`;}else{const up=c==='up',vin=up?'1.8 V':'5 V',vout=up?'5 V':'1.8 V',x=w*.59,rp=w*.77,bottom=302;svg.dataset.pass='rated';svg.innerHTML=`<title>利用额定合适的 OD 缓冲器转换逻辑电平</title><desc>OD 输出只主动拉低，外接上拉电阻接到接收方电源。输入电路和输出端均须支持图示电压。</desc>${t(12,25,'驱动侧：'+vin)}${t(w-12,25,'接收侧：'+vout,'','end')}${p(`M 15 180 H ${x-38} M ${x-38} 158 V 202 L ${x-10} 180 Z M ${x-10} 180 H ${x+8} M ${x+8} 158 V 202 M ${x+18} 151 V 169 M ${x+18} 177 V 195 M ${x+18} 203 V 221 M ${x+18} 151 V 116 H ${w-12} M ${x+18} 221 V ${bottom} M ${x+4} ${bottom} H ${x+32} M ${x+9} ${bottom+6} H ${x+27} M ${x+14} ${bottom+12} H ${x+22} M ${rp} 116 V 93 M ${rp} 53 V 39`)}<circle cx="${x-6}" cy="180" r="4" fill="var(--background)" stroke="var(--foreground)"/><rect x="${rp-6}" y="53" width="12" height="40" fill="var(--background)" stroke="var(--foreground)"/>${t(rp+12,78,'Rₚ')}${t(12,151,'输入 '+vin)}${t(x-43,245,'OD 输出级','small')}${t(w-12,105,'Y','', 'end')}${t(12,345,'上拉电源：'+vout)}${t(12,374,'仅适用于额定电压允许的接口器件','small')}`;root.querySelector('[data-result]').textContent='输出管截止：电阻拉高；输出管导通：拉低。上拉电源决定高电平。';}}
    function restore(v){const z=v?.privateContent?.c;c=['hc','hct','reverse','up','down'].includes(z)?z:'hc';draw();}root.querySelector('select').addEventListener('change',e=>{c=e.target.value;draw();lessonHost?.setWidgetState({modelContent:{connection:c},privateContent:{c}}).catch(()=>{});});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});})();
  
})();</script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
