<script>(()=>{const lessonHost=window.courseState("ttl-open-collector-pullup");

  (()=>{const root=document.getElementById('ttl-oc-lesson'),svg=root.querySelector('svg');let s={c:'20',on:0,r:1};const configs={book:{n:2,m:9,ml:3,leak:.2,ih:.04,il:1,cap:16,high:3,nor:false,pins:3},'20':{n:3,m:6,ml:3,leak:.1,ih:.02,il:.4,cap:8,high:3.2,nor:false,pins:2},'21':{n:2,m:6,ml:6,leak:.1,ih:.02,il:.4,cap:8,high:3.4,nor:true,pins:2}};
    function draw(){const q=configs[s.c],w=root.clientWidth,rpx=w-48,bus=w*.31,g=w-89,highLoad=q.n*q.leak+q.m*q.ih,rmax=(5-q.high)/highLoad,rmin=4.6/(q.cap-q.ml*q.il),vo=5-s.r*highLoad,iLow=4.6/s.r+q.ml*q.il,ok=s.on?iLow<=q.cap:vo>=q.high;root.querySelector('[data-case]').value=s.c;root.querySelector('[data-on]').value=String(s.on);root.querySelector('[data-r]').value=String(s.r);svg.setAttribute('viewBox',`0 0 ${w} 550`);svg.setAttribute('height','550');Object.assign(svg.dataset,{min:rmin,max:rmax,pass:String(ok)});
      const p=d=>`<path class="wire" d="${d}"/>`,t=(x,y,z,c='')=>`<text x="${x}" y="${y}" class="${c}">${z}</text>`;let drivers='',loads='';for(let i=0;i<q.n;i++){const x=32+i*(w-130)/Math.max(1,q.n-1);drivers+=p(`M ${x} 119 V 157 M ${x} 157 L ${x-18} 171 M ${x-18} 161 V 193 M ${x-18} 183 L ${x} 199 V 220 M ${x-8} 187 L ${x} 199 L ${x-2} 186 M ${x-13} 220 H ${x+13} M ${x-8} 226 H ${x+8}`)+t(x-14,251,'OC'+(i+1),'small');if(s.on&&i===0)drivers+=`<path d="M ${x+12} 144 V 211 m -5 -7 l 5 7 l 5 -7" fill="none" stroke="var(--viz-series-1)" stroke-width="2.5"/>`;}
      for(let i=0;i<3;i++){const y=331+i*64;const shape=q.nor?`M ${g} ${y-20} Q ${g+14} ${y} ${g} ${y+20} Q ${g+32} ${y+22} ${g+50} ${y} Q ${g+32} ${y-22} ${g} ${y-20}`:`M ${g} ${y-20} H ${g+25} A 20 20 0 0 1 ${g+25} ${y+20} H ${g} Z`;loads+=p(shape)+`<circle cx="${g+49}" cy="${y}" r="4" fill="var(--background)" stroke="var(--foreground)"/>`+p(`M ${g+53} ${y} H ${g+72}`);for(let j=0;j<q.pins;j++){const py=y+(j-(q.pins-1)/2)*12;loads+=p(`M ${bus} ${py} H ${g+2}`)+`<circle cx="${bus}" cy="${py}" r="2.5" fill="var(--foreground)"/>`;}}
      svg.innerHTML=`<title>OC 上拉电阻，${s.c==='book'?'课本例 3.4.5':'习题 3.'+s.c}</title><desc>上半图为并联的集电极开路输出管，下半图为同一节点连接的三个负载门。只保留输出级与负载连接。</desc>${t(rpx-20,22,'+5 V')}${p(`M ${rpx} 29 V 49 M ${rpx} 89 V 119 H 32 M ${rpx} 119 V 282 H ${bus} V 475`)}<rect x="${rpx-6}" y="49" width="12" height="40" fill="var(--background)" stroke="var(--foreground)"/>${t(rpx-95,74,'R = '+s.r+' kΩ','small')}${t(12,104,'并联输出管','small')}${drivers}${loads}${t(12,298,'同一个输出节点 Y','small')}${t(12,511,'高电平计数 m = '+q.m+'；低电平计数 m′ = '+q.ml,'small')}${t(12,538,ok?(s.on?'低电平电流未超限':'高电平电压满足要求'):(s.on?'电流超限，不能保证低电平':'电压不足，不能保证高电平'),'small')}`;
      root.querySelector('[data-result]').textContent=`允许 R：${rmin.toFixed(2)}～${rmax.toFixed(2)} kΩ；`+(s.on?`按 vₒ = 0.4 V 校核，需吸收 ${iLow.toFixed(2)} mA / 允许 ${q.cap} mA`:ok?`高电平模型：vₒ ≈ ${vo.toFixed(2)} V；要求 ≥ ${q.high} V`:'上拉电阻压降过大，不能保证所需高电平。');
    }
    function save(){lessonHost?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}function restore(v){const q=v?.privateContent;if(q&&configs[q.c]&&[.3,1,10].includes(+q.r))s={c:q.c,on:+q.on===1?1:0,r:+q.r};draw();}for(const [attr,key] of [['case','c'],['on','on'],['r','r']])root.querySelector('[data-'+attr+']').addEventListener('change',e=>{s[key]=key==='c'?e.target.value:+e.target.value;draw();save();});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});})();
  
})();</script>
