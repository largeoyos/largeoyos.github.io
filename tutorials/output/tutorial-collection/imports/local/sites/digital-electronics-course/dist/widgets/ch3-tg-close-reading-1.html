<svg aria-label="教材图 3.3.38：由反相器和传输门组成异或门" class="de-circuit" data-output="0" data-tg1="false" role="img" viewbox="0 0 708 411"><title>教材图 3.3.38 的异或门</title><desc>与教材连接一致。A 经反相器得到 A 的反相。TG1 的带圆圈控制端接 A，无圆圈端接 A 的反相，故 A 为零时接通并传送 B。TG2 控制相反，A 为一时接通并传送 B 的反相。跨线弧表示不连接，圆点表示连接。忽略传播延迟和切换瞬态。</desc><path class="wire" d="M 20 40 H 65"></path><path class="wire" d="M 65 25 L 95 40 L 65 55 Z"></path><circle cx="100" cy="40" fill="var(--background)" r="5" stroke="currentColor" stroke-width="1.8"></circle><path class="wire" d="M 105 40 H 140 V 263 H 467.28000000000003 V 282"></path><path class="wire" d="M 40 40 V 12 H 690 V 365 H 467.28000000000003 V 338 M 467.28000000000003 12 V 117"></path><path class="wire" d="M 140 210 H 467.28000000000003 V 173"></path><circle cx="40" cy="40" fill="currentColor" r="3"></circle><circle cx="467.28000000000003" cy="12" fill="currentColor" r="3"></circle><circle cx="140" cy="210" fill="currentColor" r="3"></circle><text text-anchor="start" x="20" y="78">A = 1</text><text class="small" text-anchor="start" x="108" y="29">A′ = 0</text><path class="wire" d="M 20 150 H 135 M 145 150 H 437.28000000000003"></path><path d="M 135 150 Q 140 137 145 150" fill="none" stroke="var(--background)" stroke-width="7"></path><path class="wire" d="M 135 150 Q 140 137 145 150"></path><path class="wire active" d="M 40 150 V 315 H 65"></path><path class="wire" d="M 65 300 L 95 315 L 65 330 Z"></path><circle cx="100" cy="315" fill="var(--background)" r="5" stroke="currentColor" stroke-width="1.8"></circle><path class="wire active" d="M 105 315 H 437.28000000000003"></path><circle cx="40" cy="150" fill="currentColor" r="3"></circle><text text-anchor="start" x="20" y="134">B = 1</text><text class="small" text-anchor="start" x="108" y="299">B′ = 0</text><path class="wire" d="M 497.28000000000003 150 H 643 V 240"></path><path class="wire active" d="M 497.28000000000003 315 H 643 V 240"></path><path class="wire active" d="M 643 240 H 678"></path><circle cx="643" cy="240" fill="currentColor" r="3"></circle><text text-anchor="end" x="633" y="226">Y = 0</text><rect fill="var(--background)" height="46" stroke="currentColor" stroke-width="1.8" width="60" x="437.28000000000003" y="127"></rect><text text-anchor="middle" x="467.28000000000003" y="149">TG1</text><text class="small" text-anchor="middle" x="467.28000000000003" y="167">断开</text><circle cx="467.28000000000003" cy="122" fill="var(--background)" r="5" stroke="currentColor" stroke-width="1.8"></circle><text class="small" text-anchor="end" x="456.28000000000003" y="114">A = 1</text><text class="small" text-anchor="end" x="456.28000000000003" y="187">A′ = 0</text><rect fill="var(--background)" height="46" stroke="currentColor" stroke-width="1.8" width="60" x="437.28000000000003" y="292"></rect><text text-anchor="middle" x="467.28000000000003" y="314">TG2</text><text class="small" text-anchor="middle" x="467.28000000000003" y="332">接通</text><circle cx="467.28000000000003" cy="287" fill="var(--background)" r="5" stroke="currentColor" stroke-width="1.8"></circle><text class="small" text-anchor="end" x="456.28000000000003" y="279">A′ = 0</text><text class="small" text-anchor="end" x="456.28000000000003" y="352">A = 1</text><text class="small" text-anchor="start" x="12" y="399">图 3.3.38 · 理想逻辑分析</text></svg>

<style>
    #de-textbook-tg-xor .de-circuit{display:block;width:100%;color:var(--foreground)}
    #de-textbook-tg-xor .de-circuit text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}

<script>(()=>{const lessonHost=window.courseState("textbook-tg-xor");

  (function(){
    const root=document.getElementById('de-textbook-tg-xor'),svg=root.querySelector('svg');let bits={a:1,b:1};
    function restore(saved){const s=saved&&(saved.privateContent||saved.modelContent);if(s)for(const k of ['a','b'])if(s[k]===0||s[k]===1)bits[k]=s[k];}
    function save(){if(lessonHost&&lessonHost.setWidgetState)lessonHost.setWidgetState({modelContent:bits,privateContent:bits}).catch(function(){});}
    const text=function(x,y,t,a,small){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'start')+'"'+(small?' class="small"':'')+'>'+t+'</text>';};
    const path=function(d,on){return '<path class="wire '+(on?'active':'')+'" d="'+d+'"/>';};
    const dot=function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="3" fill="currentColor"/>';};
    function inv(x,y){return '<path class="wire" d="M '+x+' '+(y-15)+' L '+(x+30)+' '+y+' L '+x+' '+(y+15)+' Z"/><circle cx="'+(x+35)+'" cy="'+y+'" r="5" fill="var(--background)" stroke="currentColor" stroke-width="1.8"/>';}
    function tg(x,y,i,on,p,n){return '<rect x="'+(x-30)+'" y="'+(y-23)+'" width="60" height="46" fill="var(--background)" stroke="currentColor" stroke-width="1.8"/>'+text(x,y-1,'TG'+i,'middle')+text(x,y+17,on?'接通':'断开','middle',true)+'<circle cx="'+x+'" cy="'+(y-28)+'" r="5" fill="var(--background)" stroke="currentColor" stroke-width="1.8"/>'+text(x-11,y-36,p,'end',true)+text(x-11,y+37,n,'end',true);}
    function draw(){
      const w=svg.getBoundingClientRect().width||root.clientWidth,x=w*0.66,join=w-65,arail=w-18,a=bits.a,b=bits.b,y=a^b;
      let out='<title>教材图 3.3.38 的异或门</title><desc>与教材连接一致。A 经反相器得到 A 的反相。TG1 的带圆圈控制端接 A，无圆圈端接 A 的反相，故 A 为零时接通并传送 B。TG2 控制相反，A 为一时接通并传送 B 的反相。跨线弧表示不连接，圆点表示连接。忽略传播延迟和切换瞬态。</desc>';
      out+=path('M 20 40 H 65')+inv(65,40)+path('M 105 40 H 140 V 263 H '+x+' V 282');
      out+=path('M 40 40 V 12 H '+arail+' V 365 H '+x+' V 338 M '+x+' 12 V 117');
      out+=path('M 140 210 H '+x+' V 173')+dot(40,40)+dot(x,12)+dot(140,210);
      out+=text(20,78,'A = '+a)+text(108,29,'A′ = '+(1-a),undefined,true);
      out+=path('M 20 150 H 135 M 145 150 H '+(x-30),!a);
      out+='<path d="M 135 150 Q 140 137 145 150" fill="none" stroke="var(--background)" stroke-width="7"/>'+path('M 135 150 Q 140 137 145 150',!a);
      out+=path('M 40 150 V 315 H 65',!!a)+inv(65,315)+path('M 105 315 H '+(x-30),!!a)+dot(40,150);
      out+=text(20,134,'B = '+b)+text(108,299,'B′ = '+(1-b),undefined,true);
      out+=path('M '+(x+30)+' 150 H '+join+' V 240',!a)+path('M '+(x+30)+' 315 H '+join+' V 240',!!a)+path('M '+join+' 240 H '+(w-30),true)+dot(join,240);
      out+=text(join-10,226,'Y = '+y,'end')+tg(x,150,1,!a,'A = '+a,'A′ = '+(1-a))+tg(x,315,2,!!a,'A′ = '+(1-a),'A = '+a);
      out+=text(12,399,'图 3.3.38 · 理想逻辑分析',undefined,true);
      svg.setAttribute('viewBox','0 0 '+w+' 411');svg.setAttribute('data-output',String(y));svg.setAttribute('data-tg1',String(!a));svg.innerHTML=out;
      root.querySelectorAll('[data-bit]').forEach(function(btn){btn.textContent=btn.dataset.bit.toUpperCase()+' = '+bits[btn.dataset.bit];btn.setAttribute('aria-pressed',String(!!bits[btn.dataset.bit]));});
      root.querySelector('[data-status]').textContent='TG'+(a?2:1)+' 接通 · Y 跟随 '+(a?'B′':'B')+' = '+y;
    }
    restore(lessonHost&&lessonHost.widgetState);root.querySelectorAll('[data-bit]').forEach(function(b){b.addEventListener('click',function(){bits[b.dataset.bit]=1-bits[b.dataset.bit];draw();save();});});
    window.addEventListener('openai:set_globals',function(e){if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);draw();}});
    new ResizeObserver(draw).observe(svg);draw();
  })();
  
})();</script>
</div>
