<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch3-ttl-fanout-0")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch3-ttl-fanout-0",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script></head><body><div id="ttl-fanout-lesson">
<div class="viz-controls">
<label class="form-label">每个负载<select class="form-select" data-kind=""><option value="single">一个输入脚</option><option value="nand">与非门两个输入脚并接</option><option value="nor">或非门两个输入脚并接</option></select></label>
<button aria-pressed="true" class="btn" data-level="" type="button">驱动输出：高电平</button>
<label class="form-label">负载门数<select class="form-select" data-n=""><option>1</option><option>5</option><option>6</option><option>10</option><option>11</option></select></label>
</div>
<svg aria-label="TTL 高低电平电流方向与扇出限制" class="de-circuit" data-max="5" data-pass="true" data-total="0.4" height="350" role="img" viewbox="0 0 708 350"><title>TTL 电流与负载</title><desc>高电平时驱动门向负载提供电流；低电平时负载输入端流出的电流由驱动门吸收。图中三个负载代表所选总数。</desc><path class="wire" d="M 12 149 H 35 M 35 126 L 74 149 L 35 172 Z"></path><circle cx="79" cy="149" fill="var(--background)" r="4" stroke="var(--foreground)"></circle><path class="wire" d="M 83 149 H 364 V 232 M 364 149 V 66"></path><path class="wire" d="M 621 55 H 644 A 19 19 0 0 1 644 93 H 621 Z"></path><circle cx="667" cy="74" fill="var(--background)" r="4" stroke="var(--foreground)"></circle><path class="wire" d="M 671 74 H 690 M 364 66 H 622 M 364 82 H 622"></path><path class="wire" d="M 621 130 H 644 A 19 19 0 0 1 644 168 H 621 Z"></path><circle cx="667" cy="149" fill="var(--background)" r="4" stroke="var(--foreground)"></circle><path class="wire" d="M 671 149 H 690 M 364 141 H 622 M 364 157 H 622"></path><path class="wire" d="M 621 205 H 644 A 19 19 0 0 1 644 243 H 621 Z"></path><circle cx="667" cy="224" fill="var(--background)" r="4" stroke="var(--foreground)"></circle><path class="wire" d="M 671 224 H 690 M 364 216 H 622 M 364 232 H 622"></path><text class="" x="12" y="199">驱动门</text><text class="small" x="12" y="270">负载共 5 个</text><path d="M 115 24 H 596 m -7 -5 l 7 5 l -7 5" fill="none" stroke="var(--viz-series-1)" stroke-width="2.5"></path><text class="small" x="12" y="294">电流：驱动门 → 负载输入</text><text class="small" x="12" y="321">每门：2 × 40 μA</text></svg>
<div aria-live="polite" class="tabular-nums" data-result="">总电流 0.40 mA / 允许 0.4 mA；此电平最多 5 个；满足电流条件</div>
<style>
    #ttl-fanout-lesson .de-circuit{display:block;width:100%}
    #ttl-fanout-lesson .wire{fill:none;stroke:var(--foreground);stroke-width:1.5}
    #ttl-fanout-lesson svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}
    #ttl-fanout-lesson svg .small{font-size:calc(var(--font-size-base)*.857)}
  </style>
<script>(()=>{const lessonHost=window.courseState("ttl-fanout-current-direction");

  (()=>{const root=document.getElementById('ttl-fanout-lesson'),svg=root.querySelector('svg');let s={kind:'nand',h:1,n:5};
    function draw(){const w=root.clientWidth,l=35,r=w-87,bus=(l+72+r)/2,m=s.kind==='single'?1:2,low=s.kind==='nor'?2:1,per=s.h?m*.04:low*1.6,total=s.n*per,limit=s.h?.4:16,max=Math.floor(limit/per);root.querySelector('[data-kind]').value=s.kind;root.querySelector('[data-n]').value=String(s.n);const bt=root.querySelector('[data-level]');bt.textContent='驱动输出：'+(s.h?'高电平':'低电平');bt.setAttribute('aria-pressed',String(!!s.h));svg.setAttribute('viewBox',`0 0 ${w} 350`);svg.setAttribute('height','350');svg.dataset.total=total;svg.dataset.max=max;svg.dataset.pass=String(total<=limit+1e-9);
      const p=d=>`<path class="wire" d="${d}"/>`,t=(x,y,z,c='')=>`<text x="${x}" y="${y}" class="${c}">${z}</text>`;let gates='';for(let i=0;i<3;i++){const y=74+i*75;const body=s.kind==='nor'?`M ${r} ${y-19} Q ${r+12} ${y} ${r} ${y+19} Q ${r+34} ${y+22} ${r+47} ${y} Q ${r+34} ${y-22} ${r} ${y-19}`:`M ${r} ${y-19} H ${r+23} A 19 19 0 0 1 ${r+23} ${y+19} H ${r} Z`;gates+=p(body)+`<circle cx="${r+46}" cy="${y}" r="4" fill="var(--background)" stroke="var(--foreground)"/>`+p(`M ${r+50} ${y} H ${r+69} M ${bus} ${y-8} H ${r+1} M ${bus} ${y+8} H ${r+1}`);if(s.kind==='single')gates+=p(`M ${r-12} ${y+8} V ${y+26} H ${r-3}`);}
      if(s.kind==='single')gates='';
      if(s.kind==='single')for(let i=0;i<3;i++){const y=74+i*75;gates+=p(`M ${r} ${y-19} H ${r+23} A 19 19 0 0 1 ${r+23} ${y+19} H ${r} Z`)+`<circle cx="${r+46}" cy="${y}" r="4" fill="var(--background)" stroke="var(--foreground)"/>`+p(`M ${r+50} ${y} H ${r+69} M ${bus} ${y-8} H ${r} M ${r-12} ${y+26} V ${y+8} H ${r}`)+t(r-16,y+41,'1','small');}
      const x0=l+80,x1=r-25,yy=24,dir=s.h?1:-1,start=dir===1?x0:x1,end=dir===1?x1:x0;
      svg.innerHTML=`<title>TTL 电流与负载</title><desc>高电平时驱动门向负载提供电流；低电平时负载输入端流出的电流由驱动门吸收。图中三个负载代表所选总数。</desc>${p(`M 12 149 H ${l} M ${l} 126 L ${l+39} 149 L ${l} 172 Z`)}<circle cx="${l+44}" cy="149" r="4" fill="var(--background)" stroke="var(--foreground)"/>${p(`M ${l+48} 149 H ${bus} V 232 M ${bus} 149 V 66`)}${gates}${t(12,199,'驱动门')}${t(r-5,260,'负载共 '+s.n+' 个','small')}<path d="M ${start} ${yy} H ${end} m ${-dir*7} -5 l ${dir*7} 5 l ${-dir*7} 5" fill="none" stroke="var(--viz-series-1)" stroke-width="2.5"/>${t(12,294,s.h?'电流：驱动门 → 负载输入':'电流：负载输入 → 驱动门','small')}${t(12,321,'每门：'+(s.h?(m+' × 40 μA'):(low+' × 1.6 mA')),'small')}`;
      for(const label of svg.querySelectorAll('text'))if(label.textContent.startsWith('负载共')){label.setAttribute('x','12');label.setAttribute('y','270');}
      root.querySelector('[data-result]').textContent=`总电流 ${total.toFixed(2)} mA / 允许 ${limit} mA；此电平最多 ${max} 个；${total<=limit+1e-9?'满足':'超出'}电流条件`;
    }
    function save(){lessonHost?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}function restore(v){const q=v?.privateContent;if(q&&['single','nand','nor'].includes(q.kind)&&[1,5,6,10,11].includes(+q.n))s={kind:q.kind,h:q.h===0?0:1,n:+q.n};draw();}
    root.querySelector('[data-kind]').addEventListener('change',e=>{s.kind=e.target.value;draw();save();});root.querySelector('[data-level]').addEventListener('click',()=>{s.h=1-s.h;draw();save();});root.querySelector('[data-n]').addEventListener('change',e=>{s.n=+e.target.value;draw();save();});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  })();
  
})();</script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
