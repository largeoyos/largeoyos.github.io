<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch3-ttl-resistors-0")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch3-ttl-resistors-0",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ttl-input-r-lesson">

<svg aria-label="TTL 输入电阻和滤波电路" class="de-circuit" data-vi="0.47777777777777775" height="345" role="img" viewbox="0 0 708 345"><title>TTL 输入电阻网络</title><desc>按课本及相应习题近似模型显示稳态输入电压。</desc><path class="wire" d="M 635 144 V 186 L 668 165 Z"></path><circle cx="673" cy="165" fill="var(--background)" r="4" stroke="var(--foreground)"></circle><path class="wire" d="M 677 165 H 699"></path><path class="wire" d="M 290.28 165 H 635 M 290.28 165 V 205 M 290.28 251 V 280"></path><rect fill="var(--background)" height="46" stroke="var(--foreground)" width="12" x="284.28" y="205"></rect><path class="wire" d="M 278.28 280 H 302.28 M 282.28 286 H 298.28 M 287.28 292 H 293.28"></path><text class="" x="274.28" y="145">vᵢ</text><text class="" x="304.28" y="234">R</text><text class="" x="12" y="44">74 系列输入模型</text><text class="" x="12" y="325">vᵢ ≈ 0.48 V</text></svg>

    #ttl-input-r-lesson .de-circuit{display:block;width:100%}

<script>(()=>{const lessonHost=window.courseState("ttl-input-resistor-networks");

  (()=>{const root=document.getElementById('ttl-input-r-lesson'),svg=root.querySelector('svg');let s={view:'ground',r:.5,h:0,closed:0};function draw(){const w=root.clientWidth,g=w-73,x=w*.41,p=d=>`<path class="wire" d="${d}"/>`,t=(a,y,z,c='')=>`<text x="${a}" y="${y}" class="${c}">${z}</text>`,ground=(a,y)=>p(`M ${a-12} ${y} H ${a+12} M ${a-8} ${y+6} H ${a+8} M ${a-3} ${y+12} H ${a+3}`),gate=p(`M ${g} 144 V 186 L ${g+33} 165 Z`)+`<circle cx="${g+38}" cy="165" r="4" fill="var(--background)" stroke="var(--foreground)"/>`+p(`M ${g+42} 165 H ${w-9}`);root.querySelector('[data-view]').value=s.view;root.querySelector('[data-r]').value=String(s.r);root.querySelector('[data-r-label]').hidden=s.view==='filter';root.querySelector('[data-level]').hidden=s.view!=='series';root.querySelector('[data-level]').textContent='驱动输出：'+(s.h?'3.4':'0.2')+' V';root.querySelector('[data-level]').setAttribute('aria-pressed',String(!!s.h));root.querySelector('[data-switch]').hidden=s.view!=='filter';root.querySelector('[data-switch]').textContent='开关 S：'+(s.closed?'闭合':'断开');root.querySelector('[data-switch]').setAttribute('aria-pressed',String(!!s.closed));svg.setAttribute('viewBox',`0 0 ${w} 345`);svg.setAttribute('height','345');let body='',v;
      if(s.view==='ground'){v=Math.min(1.4,4.3*s.r/(4+s.r));body=gate+p(`M ${x} 165 H ${g} M ${x} 165 V 205 M ${x} 251 V 280`)+`<rect x="${x-6}" y="205" width="12" height="46" fill="var(--background)" stroke="var(--foreground)"/>`+ground(x,280)+t(x-16,145,'vᵢ')+t(x+14,234,'R')+t(12,44,'74 系列输入模型')+t(12,325,'vᵢ ≈ '+v.toFixed(2)+' V');root.querySelector('[data-result]').textContent=v<=.8?'电阻足够小，输入满足低电平要求。':'接了地线，仍可能不能形成合格的低电平。';}
      else if(s.view==='series'){v=s.h?3.4-.04*s.r:Math.min(1.4,(.8+4.3*s.r)/(4+s.r));const rx=w*.39;body=gate+p(`M 12 165 H ${rx-25} M ${rx+25} 165 H ${g}`)+`<rect x="${rx-25}" y="158" width="50" height="14" fill="var(--background)" stroke="var(--foreground)"/>`+t(12,137,(s.h?'3.4':'0.2')+' V')+t(rx-5,195,'R')+t(g-27,134,'vᵢ')+t(12,44,'74 系列两级之间')+t(12,325,'vᵢ ≈ '+v.toFixed(2)+' V');root.querySelector('[data-result]').textContent=(s.h?v>=2:v<=.8)?'满足该电平的输入要求。':'不能保证该电平被正确识别。';}
      else{v=s.closed?.4:4;const c=w*.61,r1=w*.32,rx=(r1+c)/2;body=gate+p(`M ${r1} 35 V 64 M ${r1} 106 V 165 H ${rx-15} M ${rx+15} 165 H ${g} M ${c} 165 V 222 M ${c-13} 222 H ${c+13} M ${c-13} 229 H ${c+13} M ${c} 229 V 273 M ${r1} 165 H 62 M 35 165 V 273`)+p(s.closed?'M 35 165 H 62':'M 35 152 L 62 165')+`<rect x="${r1-6}" y="64" width="12" height="42" fill="var(--background)" stroke="var(--foreground)"/><rect x="${rx-15}" y="158" width="30" height="14" fill="var(--background)" stroke="var(--foreground)"/>`+ground(c,273)+ground(35,273)+t(r1-15,23,'+5 V')+t(r1+12,87,'R₁','small')+t(rx-9,144,'R₂','small')+t(c+18,237,'C')+t(40,192,'S')+t(g+8,207,'×5','small')+t(12,307,'R₁ = 9.8 kΩ；R₂ = 0.2 kΩ','small')+t(12,336,'稳态 vᵢ = '+v.toFixed(1)+' V');root.querySelector('[data-result]').textContent=s.closed?'S 闭合：五路低电平输入电流流经 R₂。':'S 断开：五路高电平输入电流流经 R₁ + R₂。';}svg.dataset.vi=v;svg.innerHTML='<title>TTL 输入电阻网络</title><desc>按课本及相应习题近似模型显示稳态输入电压。</desc>'+body;}
    function save(){lessonHost?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}function restore(v){const q=v?.privateContent;if(q&&['ground','series','filter'].includes(q.view)&&[.1,.5,1,10].includes(+q.r))s={view:q.view,r:+q.r,h:+q.h===1?1:0,closed:+q.closed===1?1:0};draw();}root.querySelector('[data-view]').addEventListener('change',e=>{s.view=e.target.value;draw();save();});root.querySelector('[data-r]').addEventListener('change',e=>{s.r=+e.target.value;draw();save();});root.querySelector('[data-level]').addEventListener('click',()=>{s.h=1-s.h;draw();save();});root.querySelector('[data-switch]').addEventListener('click',()=>{s.closed=1-s.closed;draw();save();});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});})();
  
})();</script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
