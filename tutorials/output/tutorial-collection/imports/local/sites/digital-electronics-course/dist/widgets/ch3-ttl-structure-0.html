6 239 Z M 569.56 242 H 591.56 M 580.56 242 V 249 M 566.56 375 H 594.56 M 571.56 381 H 589.56 M 576.56 387 H 584.56"></path><text class="" x="119.44" y="23">+5 V</text><text class="" x="12" y="225">A</text><text class="" x="123.44" y="153">T₁</text><text class="small" x="544.56" y="239">D₂</text><text class="" text-anchor="end" x="696" y="269">Y</text><circle cx="580.56" cy="280" fill="var(--foreground)" r="3"></circle><path class="current" d="M 593.56 121 V 262 m -5 -8 l 5 8 l 5 -8"></path><text class="small" x="12" y="421">T₂ 截止；T₄ 导通；T₅ 截止</text><text class="" x="12" y="448">Y = 1，vₒ 约 3.4 V</text><text class="small" x="12" y="473">D₁ 未画；R₁=4k，R₂=1.6k</text><text class="small" x="12" y="495">R₃=1k，R₄=130Ω</text></svg>

<script>(()=>{const lessonHost=window.courseState("ttl-inverter-internal");

  (()=>{const root=document.getElementById('ttl-internal-lesson'),svg=root.querySelector('svg'),btn=root.querySelector('button');let a=0;
    function draw(){const w=root.clientWidth,x1=w*.18,x2=w*.47,x3=w*.82,b2=x2-20,b3=x3-20,mid=(x2+b3)/2;const wire=d=>`<path class="wire" d="${d}"/>`,tx=(x,y,t,c='')=>`<text x="${x}" y="${y}" class="${c}">${t}</text>`;const res=(x,y,h,label)=>`<rect x="${x-6}" y="${y}" width="12" height="${h}" fill="var(--background)" stroke="var(--foreground)" stroke-width="1.5"/>${tx(x+10,y+h/2+4,label,'small')}`;const npn=(x,y,label)=>`${wire(`M ${x-20} ${y-22} V ${y+22} M ${x-20} ${y-12} L ${x} ${y-27} M ${x-20} ${y+12} L ${x} ${y+27} M ${x-10} ${y+16} L ${x} ${y+27} L ${x-3} ${y+14}`)}${tx(x-42,y+38,label,'small')}`;
      svg.setAttribute('viewBox',`0 0 ${w} 502`);svg.setAttribute('height','502');svg.dataset.output=String(1-a);btn.textContent=a?'A = 1（3.4 V）':'A = 0（0.2 V）';btn.setAttribute('aria-pressed',String(!!a));
      svg.innerHTML=`<title>TTL 基本反相器，省略输入保护二极管 D₁</title><desc>T₁ 输入级，T₂ 倒相级，上管 T₄ 和下管 T₅ 组成推拉输出。</desc>${wire(`M ${x1} 34 H ${x3} M ${x1} 34 V 65 M ${x1} 105 V 170 M ${x1-17} 170 H ${x1+17} M ${x1-10} 170 L ${x1-29} 200 H 12 M ${x1+10} 170 L ${x1+29} 200 H ${b2} M ${x1-20} 183 L ${x1-29} 200 L ${x1-13} 193 M ${x2} 34 V 65 M ${x2} 105 V 173 M ${x2} 173 H ${b3} M ${x2} 227 V 276 M ${x2} 316 V 375 M ${x2} 238 H ${mid} V 326 H ${b3} M ${x3} 34 V 65 M ${x3} 105 V 146 M ${x3} 200 V 218 M ${x3} 249 V 299 M ${x3} 280 H ${w-12} M ${x3} 353 V 375 M ${x2} 375 H ${x3}`)}${res(x1,65,40,'R₁')}${res(x2,65,40,'R₂')}${res(x3,65,40,'R₄')}${res(x2,276,40,'R₃')}${npn(x2,200,'T₂')}${npn(x3,173,'T₄')}${npn(x3,326,'T₅')}${wire(`M ${x3-10} 220 L ${x3+10} 220 L ${x3} 239 Z M ${x3-11} 242 H ${x3+11} M ${x3} 242 V 249 M ${x3-14} 375 H ${x3+14} M ${x3-9} 381 H ${x3+9} M ${x3-4} 387 H ${x3+4}`)}${tx(x1-8,23,'+5 V')}${tx(12,225,'A')}${tx(x1-4,153,'T₁')}${tx(x3-36,239,'D₂','small')}${tx(w-12,269,'Y').replace('<text ','<text text-anchor="end" ')}<circle cx="${x3}" cy="280" r="3" fill="var(--foreground)"/>${a?`<path class="current" d="M ${x3+13} 293 V 367 m -5 -8 l 5 8 l 5 -8"/>`:`<path class="current" d="M ${x3+13} 121 V 262 m -5 -8 l 5 8 l 5 -8"/>`}${tx(12,421,a?'T₂ 导通；T₄ 截止；T₅ 饱和':'T₂ 截止；T₄ 导通；T₅ 截止','small')}${tx(12,448,a?'Y = 0，vₒ 约 0.2 V':'Y = 1，vₒ 约 3.4 V')}${tx(12,473,'D₁ 未画；R₁=4k，R₂=1.6k，R₃=1k，R₄=130Ω','small')}`;
      const params=svg.querySelector('text:last-child');params.textContent='D₁ 未画；R₁=4k，R₂=1.6k';svg.insertAdjacentHTML('beforeend',tx(12,495,'R₃=1k，R₄=130Ω','small'));
      root.querySelector('[data-result]').textContent=a?'T₁ 的 b-c 结正偏，向 T₂ 提供驱动；不能把 T₁ 简单当成完全断路。':'T₁ 的 b-e 结导通，把后级控制电位压低。';
    }
    function restore(v){a=Number(v?.privateContent?.a)===1?1:0;draw();}btn.addEventListener('click',()=>{a=1-a;draw();lessonHost?.setWidgetState({modelContent:{ttlInput:a,ttlOutput:1-a},privateContent:{a}}).catch(()=>{});});new ResizeObserver(draw).observe(root);restore(lessonHost?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  })();
  
})();</script>
