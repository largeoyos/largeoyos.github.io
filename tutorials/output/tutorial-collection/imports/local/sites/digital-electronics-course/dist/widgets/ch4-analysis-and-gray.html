<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-analysis-and-gray")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-analysis-and-gray",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-analysis-and-gray">
<div class="viz-controls"><label class="form-label">电路<select class="form-select" data-mode=""><option value="analysis">逐级分析与非门电路</option><option value="gray">二进制转格雷码</option></select></label><button class="btn" data-bit="a" type="button">A</button><button class="btn" data-bit="b" type="button">B</button><button class="btn" data-bit="c" type="button">C</button><button class="btn" data-bit="d" hidden="" type="button">D</button></div>
<svg aria-label="逐级标出中间变量的门电路" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-analysis-and-gray [hidden]{display:none!important}#ch4-analysis-and-gray svg{display:block;width:100%;color:var(--foreground)}#ch4-analysis-and-gray svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-analysis-and-gray svg .small{font-size:12px}#ch4-analysis-and-gray .wire{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}#ch4-analysis-and-gray .hot{stroke:var(--viz-series-1);stroke-width:2.4}</style>
<script>
  (()=>{const root=document.getElementById('ch4-analysis-and-gray'),svg=root.querySelector('svg');let s={mode:'analysis',a:1,b:0,c:1,d:0};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`,gate=(x,y,nand)=>`<rect x="${x}" y="${y}" width="42" height="46" fill="var(--background)" stroke="currentColor"/>`+t(x+21,y+28,nand?'&amp;':'=1','middle')+(nand?`<circle cx="${x+46}" cy="${y+23}" r="4" fill="var(--background)" stroke="currentColor"/>`:'');
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['analysis','gray'].includes(v.mode))s.mode=v.mode;for(const k of ['a','b','c','d'])if(v[k]===0||v[k]===1)s[k]=v[k];}}
  function draw(){const w=svg.clientWidth||320,x=100,gx=w-78;let o='<title>逐级分析与代码转换</title><desc>与非门例子为自编入门练习。先计算 N1 等于 AB 的反，N2 等于 AC 的反，再通过与非门得到 Y。格雷码例子对应题四点七，各位通过相邻二进制位异或得到。</desc>',status='',h=320;
  if(s.mode==='analysis'){const n1=1-(s.a&s.b),n2=1-(s.a&s.c),f=1-(n1&n2);o+=t(9,45,'A = '+s.a)+t(9,98,'B = '+s.b)+t(9,252,'C = '+s.c)+p(`M 60 41 H 78 V 75 H ${x} M 78 41 V 207 H ${x} M 60 94 H ${x} M 60 248 H 84 V 226 H ${x}`)+gate(x,60,true)+gate(x,192,true)+p(`M ${x+50} 83 H ${gx-18} V 134 H ${gx}`,!!n1)+p(`M ${x+50} 215 H ${gx-10} V 153 H ${gx}`,!!n2)+t(x+58,67,'N₁='+n1,'start',true)+t(x+58,244,'N₂='+n2,'start',true)+gate(gx,121,true)+p(`M ${gx+50} 144 H ${w-5}`,!!f)+t(w-7,105,'Y = '+f,'end');status=`N₁=${n1}，N₂=${n2} → Y=${f}`;svg.setAttribute('data-output',f);
  }else{h=360;const bits=[s.a,s.b,s.c,s.d],gray=[s.a,s.a^s.b,s.b^s.c,s.c^s.d],bx=55;for(let i=0;i<4;i++){const y=43+i*83;o+=t(5,y-13,'b'+(3-i)+'='+bits[i],'start',true)+p(`M ${bx} ${y} H ${w-14}`)+t(w-9,y-13,'g'+(3-i)+'='+gray[i],'end');if(i>0){const xx=w-114,branch=bx+25+i*11;o+=gate(xx,y-25,false)+p(`M ${branch} ${y-83} V ${y+7} H ${xx}`)+`<circle cx="${branch}" cy="${y-83}" r="2.5" fill="currentColor"/>`;}}status='二进制 '+bits.join('')+' → 格雷码 '+gray.join('');svg.setAttribute('data-output',parseInt(gray.join(''),2));}
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=o;root.querySelector('[data-status]').textContent=status;root.querySelector('select').value=s.mode;root.querySelectorAll('[data-bit]').forEach(b=>{const k=b.dataset.bit,i=['a','b','c','d'].indexOf(k);b.hidden=k==='d'&&s.mode==='analysis';b.textContent=(s.mode==='gray'?'b'+(3-i):k.toUpperCase())+' = '+s[k];b.setAttribute('aria-pressed',!!s[k]);});}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{s[b.dataset.bit]^=1;draw();save();});root.querySelector('select').onchange=e=>{s.mode=e.target.value;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
