<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-arithmetic-circuits")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-arithmetic-circuits",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-arithmetic-circuits">
<div class="viz-controls"><label class="form-label">电路<select class="form-select" data-mode=""><option value="full">1 位全加器</option><option value="ripple">4 位串行进位</option><option value="addsub">4 位加减运算</option><option value="bcd">1 位 BCD 加法</option><option value="triple">3 位数乘 3</option></select></label><label class="form-label">A = <span data-av=""></span><input class="form-range" data-a="" max="1" min="0" type="range" value="1"/></label><label class="form-label" data-bl="">B = <span data-bv=""></span><input class="form-range" data-b="" max="1" min="0" type="range" value="1"/></label><button class="btn" data-c="" type="button">CI = 0</button></div>
<svg aria-label="全加、串行进位、加减和 BCD 修正电路" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-arithmetic-circuits [hidden]{display:none!important}#ch4-arithmetic-circuits svg{display:block;width:100%;color:var(--foreground)}#ch4-arithmetic-circuits svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-arithmetic-circuits svg .small{font-size:12px}#ch4-arithmetic-circuits .wire{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}#ch4-arithmetic-circuits .hot{stroke:var(--viz-series-1);stroke-width:2.4}</style>
<script>
  (()=>{const root=document.getElementById('ch4-arithmetic-circuits'),svg=root.querySelector('svg');let s={mode:'addsub',a:3,b:5,c:1};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`,box=(x,y,w,h,name)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`+t(x+w/2,y+h/2+5,name,'middle'),bin=(v,n=4)=>v.toString(2).padStart(n,'0');
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['full','ripple','addsub','bcd','triple'].includes(v.mode))s.mode=v.mode;for(const k of ['a','b'])if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<=15)s[k]=v[k];if(v.c===0||v.c===1)s.c=v.c;}}
  function draw(){const max=s.mode==='full'?1:s.mode==='bcd'?9:s.mode==='triple'?7:15;s.a=Math.min(s.a,max);s.b=Math.min(s.b,max);const w=svg.clientWidth||320,m=w/2;let o='<title>组合运算电路</title><desc>半加器有和、进位两个输出，两个半加器加一个或门构成全加器。串行进位从低位送到高位。加减器将 B 的各位与控制 M 异或并使最低位进位等于 M。BCD 加法器在二进制结果超过九时再加六。</desc>',h=350,status='',result=0,carry=0;
  if(s.mode==='full'){const q=s.a^s.b,c1=s.a&s.b,c2=q&s.c,sum=q^s.c;carry=c1|c2;result=sum;o+=t(m,20,'两个半加器组成全加器','middle')+t(10,64,'A = '+s.a)+t(10,91,'B = '+s.b)+p(`M 57 60 H ${m-50} M 57 86 H ${m-50}`)+box(m-50,40,100,67,'半加器 1')+t(m+60,52,'和 '+q,'start',true)+t(m-8,126,'进位 '+c1,'start',true)+p(`M ${m+50} 60 H ${w-15} V 159 H ${m+50}`)+t(10,176,'CI = '+s.c)+p(`M 68 172 H ${m-50}`)+box(m-50,143,100,67,'半加器 2')+t(w-8,230,'S = '+sum,'end')+p(`M ${m+50} 172 H ${w-16} V 213`)+p(`M ${m-25} 107 V 121 H ${m-80} V 270 H ${m-42}`,!!c1)+p(`M ${m+25} 210 V 244 H ${m+67} V 270 H ${m+42}`,!!c2)+box(m-42,256,84,43,'≥1')+p(`M ${m} 299 V 320`,!!carry)+t(m,340,'CO = '+carry,'middle');status=`${s.a} + ${s.b} + ${s.c} = ${carry}${sum}₂`;
  }else if(s.mode==='ripple'){h=560;let c=s.c;result=(s.a+s.b+s.c)&15;carry=(s.a+s.b+s.c)>>4;o+=t(m,20,'低位进位 → 高位进位','middle');for(let i=0;i<4;i++){const y=55+i*119,a=s.a>>i&1,b=s.b>>i&1,sm=a^b^c,co=+(a+b+c>=2);o+=t(8,y+16,`A${i}=${a}`,'start',true)+t(8,y+42,`B${i}=${b}`,'start',true)+p(`M 53 ${y+12} H ${m-49} M 53 ${y+38} H ${m-49}`)+box(m-49,y,98,64,'全加器 '+i)+t(w-8,y+31,`S${i}=${sm}`,'end')+p(`M ${m+49} ${y+26} H ${w-49}`)+t(m+59,y+83,`C${i+1}=${co}`,'start',true);if(i<3)o+=p(`M ${m} ${y+64} V ${y+119}`,!!co);else o+=p(`M ${m} ${y+64} V ${y+87}`,!!co);if(i===0)o+=t(m,y-13,'C₀ = '+s.c,'middle',true);c=co;}status=`${bin(s.a)} + ${bin(s.b)} + ${s.c} = ${carry} ${bin(result)}₂`;
  }else if(s.mode==='addsub'){h=480;const b=s.b^(s.c?15:0),total=s.a+b+s.c,sf=(total>>4)^s.c,valid=s.c||s.a+s.b<=15;result=total&15;carry=total>>4;
    o+=t(m,20,s.c?'M = 1 · 减法':'M = 0 · 加法','middle')+box(m-48,40,96,52,'逐位 XOR')+t(8,50,'B='+bin(s.b),'start',true)+p(`M 8 58 H ${m-48}`)+t(w-8,64,'M = '+s.c,'end')+p(`M ${m+48} 78 H ${w-20} V 352 H ${m+124} M ${w-20} 239 H ${m+64}`)+`<circle cx="${w-20}" cy="239" r="3" fill="currentColor"/>`+p(`M ${m} 92 V 166`)+t(m+10,134,'B*='+bin(b),'start',true)+box(m-64,166,128,95,'74HC283')+t(8,193,'A='+bin(s.a),'start',true)+p(`M 8 201 H ${m-64}`)+t(m+55,242,'CI','end',true)+p(`M ${m-24} 261 V 316 M ${m+40} 261 V 310 H ${m+67} V 330`)+t(m-24,338,'S₃…S₀','middle',true)+t(m-24,360,bin(result),'middle')+t(m+28,292,'CO='+carry,'end',true)+box(m+52,330,72,42,'=1')+p(`M ${m+88} 372 V 394`)+t(m+88,415,'S_F='+sf,'middle',true)+t(m,452,valid?`5 位补码：${sf} ${bin(result)}`:'A+B 超过 15，超出题 4.25 的约束','middle',true);
    status=s.c?`${s.a} − ${s.b} = ${s.a-s.b}；无符号借位 = ${1-carry}；S_F = CO ⊕ M`:`${s.a} + ${s.b} = ${total}；题 4.25 的符号位需满足结果绝对值不大于 15`;
  }else if(s.mode==='bcd'){h=550;const total=s.a+s.b+s.c,t4=total&15,c4=total>>4,k=c4|((t4>>3&1)&(t4>>2&1))|((t4>>3&1)&(t4>>1&1)),sum=t4+(k?6:0);result=sum&15;carry=k;
    o+=box(m-65,30,130,90,'第 1 个加法器')+t(8,44,'A='+bin(s.a),'start',true)+t(8,74,'B='+bin(s.b),'start',true)+p(`M 8 49 H ${m-65} M 8 79 H ${m-65}`)+t(w-8,57,'CI='+s.c,'end',true)+p(`M ${w-8} 63 H ${m+65}`)+p(`M ${m-30} 120 V 151 H ${m-90} V 382 H ${m-65} M ${m-90} 206 H ${m-43}`)+`<circle cx="${m-90}" cy="206" r="3" fill="currentColor"/>`+t(m-122,176,'T /4','middle',true)+p(`M ${m+35} 120 V 150 H ${w-19} V 207 H ${m+65}`)+t(w-25,174,'C₄='+c4,'end',true)+box(m-43,183,108,55,'修正检测 K')+p(`M ${m+10} 238 V 266 H ${m+90} V 505 M ${m+90} 410 H ${m+65}`)+`<circle cx="${m+90}" cy="410" r="3" fill="currentColor"/>`+t(m,306,'K = C₄ + T₃T₂ + T₃T₁','middle',true)+t(8,368,'T='+bin(t4),'start',true)+box(m-65,350,130,104,'第 2 个加法器')+t(m+140,394,'0KK0','end',true)+t(m+140,414,bin(k?6:0),'end',true)+t(8,424,'CI=0','start',true)+p(`M 8 432 H ${m-65} M ${m} 454 V 490`)+t(m,515,'个位 '+bin(result),'middle')+t(m+90,530,'十位 K='+k,'middle',true);
    status=`${s.a} + ${s.b} + ${s.c} = ${total}；修正加数 ${k?6:0}；十进制进位取 K，第二个加法器的 CO 不用`;
  }else{h=380;const total=3*s.a;result=total;carry=total>>4;o+=t(m,20,'3D = D + 2D','middle')+t(m,51,'D = '+bin(s.a,3),'middle')+t(m-55,100,'A=0'+bin(s.a,3),'middle',true)+t(m+55,100,'B='+bin(s.a,3)+'0','middle',true)+p(`M ${m-55} 110 V 150 M ${m+55} 110 V 150`)+box(m-86,150,172,86,'4 位加法器')+t(8,193,'CI=0','start',true)+p(`M 8 205 H ${m-86} M ${m-32} 236 V 278 M ${m+45} 236 V 278`)+t(m-32,300,'S₃…S₀='+bin(total&15),'middle',true)+t(m+70,324,'CO='+carry,'middle',true)+t(m,355,'Y₄…Y₀ = '+bin(total,5),'middle');status=`${s.a} × 3 = ${total}；Y₄ 接 CO，Y₃…Y₀ 接 S₃…S₀`;}
  if(s.mode==='ripple')o+=p(`M ${m} 46 V 55`);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('data-result',result);svg.setAttribute('data-carry',carry);svg.innerHTML=o;root.querySelector('[data-status]').textContent=status;root.querySelector('[data-mode]').value=s.mode;for(const k of ['a','b']){const el=root.querySelector('[data-'+k+']');el.max=max;el.value=s[k];root.querySelector('[data-'+k+'v]').textContent=s[k];}root.querySelector('[data-bl]').hidden=s.mode==='triple';const cb=root.querySelector('[data-c]');cb.hidden=s.mode==='triple';cb.textContent=(s.mode==='addsub'?'M':'CI')+' = '+s.c;cb.setAttribute('aria-pressed',!!s.c);}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelector('select').onchange=e=>{s.mode=e.target.value;draw();save();};for(const k of ['a','b'])root.querySelector('[data-'+k+']').oninput=e=>{s[k]=+e.target.value;draw();save();};root.querySelector('[data-c]').onclick=()=>{s.c^=1;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
