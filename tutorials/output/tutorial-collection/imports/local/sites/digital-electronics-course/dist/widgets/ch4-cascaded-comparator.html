<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-cascaded-comparator")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-cascaded-comparator",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-cascaded-comparator">
<div class="viz-controls"><label class="form-label">A = <span data-av="">37</span><input class="form-range" data-a="" max="255" min="0" type="range" value="37"/></label><label class="form-label">B = <span data-bv="">35</span><input class="form-range" data-b="" max="255" min="0" type="range" value="35"/></label></div>
<svg aria-label="两片 74HC85 构成八位数值比较器" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-cascaded-comparator svg{display:block;width:100%;color:var(--foreground)}#ch4-cascaded-comparator svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-cascaded-comparator svg .small{font-size:12px}#ch4-cascaded-comparator .wire{fill:none;stroke:currentColor;stroke-width:1.5}#ch4-cascaded-comparator .hot{stroke:var(--viz-series-1);stroke-width:2.5}</style>
<script>
  (()=>{const root=document.getElementById('ch4-cascaded-comparator'),svg=root.querySelector('svg');let s={a:37,b:35};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`;
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v)for(const k of ['a','b'])if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<=255)s[k]=v[k];}
  function draw(){const w=svg.clientWidth||320,m=w/2,left=m-110,bw=220;let d=-1;for(let i=7;i>=0;i--)if((s.a>>i&1)!==(s.b>>i&1)){d=i;break;}const relation=s.a>s.b?'>':s.a<s.b?'<':'=',lowA=s.a&15,lowB=s.b&15,lo=[+(lowA>lowB),+(lowA===lowB),+(lowA<lowB)],hiA=s.a>>4,hiB=s.b>>4,final=[+(s.a>s.b),+(s.a===s.b),+(s.a<s.b)];let o='<title>八位数比较与级联</title><desc>从最高位查找第一处不同。低四位比较结果通过大于、等于、小于三个级联信号送入高四位比较器。只有高四位相等时，高组才采用低组的结果。</desc>';
  const dx=(w-56)/8;for(let row=0;row<2;row++){o+=t(8,52+row*34,row?'B':'A');for(let i=7;i>=0;i--){const x=42+(7-i)*dx;o+=`<rect x="${x-10}" y="${33+row*34}" width="22" height="27" fill="${i===d?'var(--accent)':'none'}"/>`+t(x+1,52+row*34,(row?s.b:s.a)>>i&1,'middle');}}o+=t(m,111,'最高位 ← 7 6 5 4 | 3 2 1 0 → 最低位','middle',true);
  function chip(y,name,a,b){return `<rect x="${left}" y="${y}" width="${bw}" height="96" fill="none" stroke="currentColor" stroke-width="1.5"/>`+t(m,y+25,name,'middle')+t(m,y+52,`A组 = ${a.toString(2).padStart(4,'0')} · B组 = ${b.toString(2).padStart(4,'0')}`,'middle',true);}
  o+=chip(143,'74HC85 · 低 4 位',lowA,lowB)+t(m,222,'I&gt; = 0 · I= = 1 · I&lt; = 0','middle',true)+chip(356,'74HC85 · 高 4 位',hiA,hiB);const labels=['>','=','<'];for(let i=0;i<3;i++){const x=m+(i-1)*70;o+=p(`M ${x} 239 V 356`,!!lo[i])+t(x+8,278,'Y'+labels[i]+' = '+lo[i],'start',true)+t(x,344,'I'+labels[i],'middle',true)+t(x,437,'Y'+labels[i]+' = '+final[i],'middle',true);}
  o+=t(m,484,'A '+relation+' B','middle');svg.setAttribute('viewBox',`0 0 ${w} 501`);svg.setAttribute('data-relation',relation);svg.setAttribute('data-deciding-bit',d);svg.innerHTML=o;root.querySelector('[data-status]').textContent=d<0?'全部位相等':`最高的不同位是第 ${d} 位 · 高 4 位${hiA===hiB?'相等，采用低组结果':'已决定大小'}`;for(const k of ['a','b']){root.querySelector('[data-'+k+']').value=s[k];root.querySelector('[data-'+k+'v]').textContent=s[k];}}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);for(const k of ['a','b'])root.querySelector('[data-'+k+']').oninput=e=>{s[k]=+e.target.value;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
