<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-decoder-functions")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-decoder-functions",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script></head><body><div id="ch4-decoder-functions">
<div class="viz-controls"><button class="btn" data-bit="a" type="button">A</button><button class="btn" data-bit="b" type="button">B</button><button class="btn" data-bit="c" type="button">C</button><label class="form-check"><input checked="" class="form-check-input" data-enable="" type="checkbox"/><span class="form-check-label">使能：S₁=1，S₂′=S₃′=0</span></label><label class="form-label">输出函数<select class="form-select" data-f=""><option value="ac">题 4.12：F₁ = AC</option><option value="f2">题 4.12：F₂</option><option value="f3">题 4.12：F₃</option><option value="traffic">交通灯故障函数</option></select></label></div>
<svg aria-label="74HC138 与附加与非门实现逻辑函数" role="img"></svg>
<div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-decoder-functions svg{display:block;width:100%;color:var(--foreground)}#ch4-decoder-functions svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-decoder-functions svg .small{font-size:12px}#ch4-decoder-functions .wire{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}#ch4-decoder-functions .hot{stroke:var(--viz-series-1);stroke-width:2.4}</style>
<script>
  (()=>{const root=document.getElementById('ch4-decoder-functions'),svg=root.querySelector('svg');let s={a:1,b:0,c:1,enable:true,f:'ac'};const sets={ac:[5,7],f2:[1,3,4,7],f3:[0,4,6],traffic:[0,3,5,6,7]},t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`,c=(x,y)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`;
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){for(const k of ['a','b','c'])if(v[k]===0||v[k]===1)s[k]=v[k];if(typeof v.enable==='boolean')s.enable=v.enable;if(sets[v.f])s.f=v.f;}}
  function draw(){const w=svg.clientWidth||320,x=65,bw=88,gx=w-76,index=s.a*4+s.b*2+s.c,set=sets[s.f],f=+(s.enable&&set.includes(index));let out='<title>低有效译码输出与最小项</title><desc>A、B、C 接地址 A2、A1、A0。被选中的输出引脚为零，其余为一。选择所需最小项对应的低有效输出，接入一个与非门，得到最小项之和。</desc>'+t(x,21,'74HC138');out+=`<rect x="${x}" y="35" width="${bw}" height="300" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
  ['A₂','A₁','A₀'].forEach((k,i)=>{const y=65+i*54;out+=t(4,y-10,['A','B','C'][i]+' = '+[s.a,s.b,s.c][i])+p(`M 5 ${y} H ${x}`)+t(x+8,y+5,k,'start',true);});out+=t(x+8,269,'S₁ = '+(+s.enable),'start',true)+t(x+8,292,'S₂′ = 0','start',true)+t(x+8,315,'S₃′ = 0','start',true);
  for(let i=0;i<8;i++){const y=57+i*36,v=+( !s.enable||index!==i );out+=t(x+bw-8,y+4,'Y'+i,'end',true)+c(x+bw+4,y)+p(`M ${x+bw+8} ${y} H ${x+bw+24}`,!v)+t(x+bw+17,y-8,String(v),'start',true);const j=set.indexOf(i);if(j>=0){const yy=160+j*16,bend=gx-15-j*6;out+=p(`M ${x+bw+24} ${y} H ${bend} V ${yy} H ${gx}`,!v);}}
  const gy=142,gh=set.length*16+20;out+=`<rect x="${gx}" y="${gy}" width="36" height="${gh}" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`+t(gx+18,gy+gh/2+5,'&amp;','middle')+c(gx+40,gy+gh/2)+p(`M ${gx+44} ${gy+gh/2} H ${w-6}`,!!f)+t(w-7,gy-10,'F = '+f,'end');svg.setAttribute('viewBox',`0 0 ${w} 352`);svg.setAttribute('data-index',index);svg.setAttribute('data-output',f);svg.innerHTML=out;root.querySelectorAll('[data-bit]').forEach(b=>{b.textContent=b.dataset.bit.toUpperCase()+' = '+s[b.dataset.bit];b.setAttribute('aria-pressed',!!s[b.dataset.bit]);});root.querySelector('[data-enable]').checked=s.enable;root.querySelector('[data-f]').value=s.f;root.querySelector('[data-status]').textContent=(s.enable?`选中 Y${index}′ = 0`:'禁止译码 · 全部输出为 1')+' · 接入的输出编号：'+set.join('、');}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{s[b.dataset.bit]^=1;draw();save();});root.querySelector('select').onchange=e=>{s.f=e.target.value;draw();save();};root.querySelector('input').onchange=e=>{s.enable=e.target.checked;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
