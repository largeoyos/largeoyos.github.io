<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-display-and-lcd")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-display-and-lcd",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-display-and-lcd">
<div class="viz-controls"><label class="form-label">示例<select class="form-select" data-mode=""><option value="led">7448 与共阴极数码管</option><option value="lcd">异或门与 LCD 电极</option><option value="level">液位监测的模块连接</option></select></label><label class="form-label" data-digit-label="">显示数字<select class="form-select" data-digit=""><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option selected="">5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label><label class="form-label" data-level-label="" hidden="">最高有效传感器档位<input class="form-range" data-level="" max="9" min="0" type="range" value="5"/></label></div>
<div class="viz-controls" data-led-controls=""><label class="form-check"><input class="form-check-input" data-lt="" type="checkbox"/><span class="form-check-label">灯测试 LT′=0</span></label><label class="form-check"><input class="form-check-input" data-bi="" type="checkbox"/><span class="form-check-label">灭灯 BI′=0</span></label><label class="form-check"><input class="form-check-input" data-rbi="" type="checkbox"/><span class="form-check-label">灭零 RBI′=0</span></label></div>
<div class="viz-controls" data-lcd-controls="" hidden=""><button class="btn" data-a="" type="button">A = 1</button></div>
<svg aria-label="显示译码与液位监测示意图" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-display-and-lcd [hidden]{display:none!important}#ch4-display-and-lcd svg{display:block;width:100%;color:var(--foreground)}#ch4-display-and-lcd svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-display-and-lcd svg .small{font-size:12px}#ch4-display-and-lcd .wire{fill:none;stroke:currentColor;stroke-width:1.6}#ch4-display-and-lcd .wave{fill:none;stroke:var(--viz-series-1);stroke-width:2}</style>
<script>
  (()=>{const root=document.getElementById('ch4-display-and-lcd'),svg=root.querySelector('svg');let s={mode:'led',digit:5,level:5,lt:false,bi:false,rbi:false,a:1};const glyph=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','cdefg','abc','abcdefg','abcfg'],t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=d=>`<path class="wire" d="${d}"/>`,box=(x,y,w,h,name)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="1.5"/>`+t(x+w/2,y+h/2+5,name,'middle');
  function seven(x,y,on,labels){let o='';const pts={a:[10,0,50,0],b:[58,8,58,43],c:[58,57,58,92],d:[10,100,50,100],e:[2,57,2,92],f:[2,8,2,43],g:[10,50,50,50]};for(const [k,v]of Object.entries(pts)){o+=`<path d="M ${x+v[0]} ${y+v[1]} L ${x+v[2]} ${y+v[3]}" stroke="${on.includes(k)?'var(--viz-series-1)':'var(--border)'}" stroke-width="7" stroke-linecap="round"/>`;if(labels)o+=t(x+v[0]+(k==='a'||k==='d'||k==='g'?20:k==='b'||k==='c'?15:-15),y+(v[1]+v[3])/2+(k==='a'||k==='d'||k==='g'?-10:5),k,'middle',true);}return o;}
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['led','lcd','level'].includes(v.mode))s.mode=v.mode;for(const k of ['digit','level'])if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<=9)s[k]=v[k];for(const k of ['lt','bi','rbi'])if(typeof v[k]==='boolean')s[k]=v[k];if(v.a===0||v.a===1)s.a=v.a;}}
  function draw(){const w=svg.clientWidth||320,m=w/2;let o='<title>显示译码与显示器</title><desc>七段名称 a 到 g。7448 的灯测试、灭灯、灭零控制按功能表优先处理。LCD 图显示两个电极的相对电压。液位图以离散水位演示编码、显示译码和报警的模块连接。</desc>',status='',h=350;root.querySelector('[data-digit-label]').hidden=s.mode!=='led';root.querySelector('[data-level-label]').hidden=s.mode!=='level';root.querySelector('[data-led-controls]').hidden=s.mode!=='led';root.querySelector('[data-lcd-controls]').hidden=s.mode!=='lcd';
  if(s.mode==='led'){h=390;const on=s.bi?'':s.lt?'abcdefg':s.rbi&&s.digit===0?'':glyph[s.digit];o+=t(m,22,'7448 · 共阴极','middle')+t(m,52,'BCD = '+s.digit.toString(2).padStart(4,'0'),'middle')+p(`M ${m} 60 V 80`)+box(m-63,80,126,66,'BCD → 七段')+p(`M ${m} 146 V 184`)+t(m+12,169,'7 根独立段线','start',true)+`<rect x="${m-72}" y="184" width="144" height="144" fill="none" stroke="currentColor"/>`+seven(m-30,207,on,true)+p(`M ${m} 328 V 354 M ${m-14} 354 H ${m+14} M ${m-9} 360 H ${m+9} M ${m-4} 366 H ${m+4}`)+t(m+22,350,'COM','start',true);status=s.bi?'全灭':s.lt?'全亮：显示 8':s.rbi&&s.digit===0?'输入 0，被消隐':'显示 '+s.digit;svg.setAttribute('data-segments',on);}
  if(s.mode==='lcd'){o+=t(m,20,'LCD 两个电极的相对电压','middle')+t(8,66,'v₁')+p(`M 30 62 H ${m-35}`)+box(m-35,38,60,48,'=1')+t(m-20,119,'A = '+s.a,'middle')+p(`M ${m-20} 102 V 86 M ${m+25} 62 H ${w-35} V 130 M 30 62 V 148 H ${w-35}`)+p(`M ${w-42} 130 H ${w-28} M ${w-42} 148 H ${w-28}`)+t(w-45,121,'vₛ','end',true)+t(w-18,145,'LCD','end',true);const left=49,right=w-12,steps=8,dx=(right-left)/steps;function wave(y,vals,name){let d=`M ${left} ${y-vals[0]*14}`;for(let i=0;i<steps;i++){if(i)d+=` V ${y-vals[i]*14}`;d+=` H ${left+(i+1)*dx}`;}return t(8,y-3,name,'start',true)+`<path class="wave" d="${d}"/>`;}const v=Array.from({length:8},(_,i)=>i%2),vs=v.map(v=>v^s.a);o+=wave(202,v,'v₁')+wave(255,vs,'vₛ')+wave(312,v.map((v,i)=>v-vs[i]),'vLCD')+t(right,335,'时间 →','end',true);status=s.a?'电极反相 · LCD 两端有交变电压':'电极同相 · LCD 两端电压为 0';}
  if(s.mode==='level'){const x=20,ty=43,th=218,bx=w-50,water=(s.level+.4)*23;h=700;o+=t(m,20,s.level?'已超过 S'+s.level+'（'+s.level+' m）':'尚未超过 S1','middle');o+=`<rect x="${x}" y="${ty}" width="74" height="${th}" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="${x+2}" y="${ty+th-water}" width="70" height="${water}" fill="var(--viz-series-1)" opacity=".14"/>`;for(let i=1;i<=9;i++){const yy=ty+th-i*23;o+=`<circle cx="89" cy="${yy}" r="3" fill="${s.level>=i?'var(--viz-series-1)':'var(--border)'}"/>`+t(103,yy-6,`S${i} = ${+(s.level>=i)}`,'start',true)+p(`M 92 ${yy} H ${bx-8} L ${bx} ${yy-8}`);}o+=p(`M ${bx} 46 V 278 H ${m} V 286`)+t(bx-10,269,'/9','end',true)+box(m-77,286,154,57,'优先编码')+p(`M ${m} 343 V 374`)+t(m+12,365,s.level.toString(2).padStart(4,'0'),'start',true)+box(m-77,374,154,57,'BCD → 七段')+p(`M ${m} 431 V 461`)+`<rect x="${m-45}" y="461" width="90" height="127" fill="none" stroke="currentColor"/>`+seven(m-30,478,glyph[s.level],false)+p(`M ${m} 588 V 611 M ${m-14} 611 H ${m+14} M ${m-9} 617 H ${m+9}`)+t(m+22,607,'COM','start',true)+t(8,650,'S9','start',true)+p(`M 8 662 H ${m-45}`)+box(m-45,646,90,32,'报警')+p(`M ${m+45} 662 H ${w-8}`)+t(w-8,652,'输出='+ +(s.level===9),'end',true);status=s.level===9?'9 档：液位已超过 9 m，S9=1，报警':'档位表示最高已被液体超过的传感器；传感器到编码器使用 9 根独立信号线';svg.setAttribute('data-level',s.level);}
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=o;root.querySelector('[data-status]').textContent=status;root.querySelector('[data-mode]').value=s.mode;root.querySelector('[data-digit]').value=s.digit;root.querySelector('[data-level]').value=s.level;for(const k of ['lt','bi','rbi'])root.querySelector('[data-'+k+']').checked=s[k];root.querySelector('[data-a]').textContent='A = '+s.a;root.querySelector('[data-a]').setAttribute('aria-pressed',!!s.a);}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelector('[data-mode]').onchange=e=>{s.mode=e.target.value;draw();save();};root.querySelector('[data-digit]').onchange=e=>{s.digit=+e.target.value;draw();save();};root.querySelector('[data-level]').oninput=e=>{s.level=+e.target.value;draw();save();};for(const k of ['lt','bi','rbi'])root.querySelector('[data-'+k+']').onchange=e=>{s[k]=e.target.checked;draw();save();};root.querySelector('[data-a]').onclick=()=>{s.a^=1;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
