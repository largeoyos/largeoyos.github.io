<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-hazard-and-consensus")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-hazard-and-consensus",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script></head><body><div id="ch4-hazard-and-consensus">
<div class="viz-controls"><label class="form-label">电路<select class="form-select" data-kind=""><option value="one">静态 1 冒险：AB + A′C</option><option value="zero">静态 0 冒险：(A+B)(B′+C)</option></select></label><label class="form-label">输入变化<select class="form-select" data-direction=""><option value="fall">1 → 0</option><option value="rise">0 → 1</option></select></label><label class="form-check"><input class="form-check-input" data-fix="" type="checkbox"/><span class="form-check-label">加入冗余项</span></label></div>
<svg aria-label="存在不同延迟路径的两级组合电路" class="circuit" role="img"></svg><svg aria-label="各门延迟均为十纳秒的示例波形" class="timing" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-hazard-and-consensus svg{display:block;width:100%;color:var(--foreground)}#ch4-hazard-and-consensus svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-hazard-and-consensus svg .small{font-size:12px}#ch4-hazard-and-consensus .wire{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}#ch4-hazard-and-consensus .wave{fill:none;stroke:var(--viz-series-1);stroke-width:2}#ch4-hazard-and-consensus .ref{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:4 4}</style>
<script>
  (()=>{const root=document.getElementById('ch4-hazard-and-consensus'),svg=root.querySelector('.circuit'),wave=root.querySelector('.timing');let s={kind:'one',direction:'fall',fix:false};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=d=>`<path class="wire" d="${d}"/>`,gate=(x,y,label,bubble=false)=>`<rect x="${x}" y="${y}" width="43" height="44" fill="var(--background)" stroke="currentColor"/>`+t(x+21.5,y+27,label,'middle')+(bubble?`<circle cx="${x+47}" cy="${y+22}" r="4" fill="var(--background)" stroke="currentColor"/>`:'');
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['one','zero'].includes(v.kind))s.kind=v.kind;if(['fall','rise'].includes(v.direction))s.direction=v.direction;if(typeof v.fix==='boolean')s.fix=v.fix;}}
  function draw(){const w=svg.clientWidth||320,one=s.kind==='one',fall=s.direction==='fall',x=97,gx=w-68,active=one?'A':'B',fixed=one?'B=C=1':'A=C=0';let o='<title>竞争冒险与冗余项</title><desc>上支路经过一个门，下支路经过反相器和一个门。两个支路都经过最后一级门。所有门的示例传播延迟为十纳秒，只演示指定单变量变化。</desc>'+t(w/2,21,fixed+' · '+active+(fall?'：1→0':'：0→1'),'middle')+t(5,73,active)+p(`M 25 69 H ${x} M 39 69 V 129 H 49`)+gate(49,107,'1',true)+p(`M 100 129 H 108 V 174 H ${x}`)+gate(x,47,one?'&amp;':'≥1')+gate(x,156,one?'&amp;':'≥1')+t(10,100,one?'B=1':'A=0','start',true)+p(`M 56 96 H 76 V 80 H ${x}`)+t(10,206,one?'C=1':'C=0','start',true)+p(`M 56 202 H 76 V 189 H ${x}`)+p(`M ${x+43} 69 H ${gx-18} V 112 H ${gx} M ${x+43} 178 H ${gx-10} V 137 H ${gx}`)+gate(gx,101,one?'≥1':'&amp;')+p(`M ${gx+43} 123 H ${w-7}`)+t(w-7,94,'Y','end');
  if(s.fix)o+=t(8,269,one?'B=1':'A=0','start',true)+t(8,294,one?'C=1':'C=0','start',true)+p(`M 51 265 H ${x} M 51 290 H ${x}`)+gate(x,255,one?'&amp;':'≥1')+p(`M ${x+43} 277 H ${gx+21} V 145`)+t(w/2,321,one?'额外项 BC = 1':'额外因子 A+C = 0','middle',true);svg.setAttribute('viewBox',`0 0 ${w} ${s.fix?338:225}`);svg.innerHTML=o;
  const before=fall?1:0,after=1-before,glitch=one?fall:!fall,rows=[[active,[[0,before],[10,after]]],['P',[[0,before],[20,after]]],['Q',[[0,after],[30,before]]],['Y',s.fix?[[0,one?1:0]]:glitch?[[0,one?1:0],[30,one?0:1],[40,one?1:0]]:[[0,one?1:0]]]],ww=wave.clientWidth||320,l=43,r=ww-13,scale=v=>l+v/60*(r-l);let v='<title>传播延迟导致的毛刺</title><desc>输入在十纳秒发生变化，P 在二十纳秒变化，Q 在三十纳秒变化。在可能出现毛刺的变化方向，输出从三十到四十纳秒出现十纳秒宽的毛刺。加入冗余项后保持稳定。这是固定等延迟的示例，不代表所有器件的实际毛刺宽度。</desc>'+t(l,18,'示例：每个门延迟 10 ns','start',true);
  for(const tick of [0,10,20,30,40,60])v+=`<path class="ref" d="M ${scale(tick)} 29 V 234"/>`+t(scale(tick),258,tick,tick===60?'end':tick===0?'start':'middle',true);
  rows.forEach(([name,events],i)=>{const y=61+i*53;let d=`M ${scale(0)} ${y-events[0][1]*20}`;for(let j=1;j<events.length;j++)d+=` H ${scale(events[j][0])} V ${y-events[j][1]*20}`;d+=` H ${scale(60)}`;v+=t(8,y-4,name,'start',true)+`<path class="wave" d="${d}"/>`;});v+=t(r,278,'t / ns','end',true);wave.setAttribute('viewBox',`0 0 ${ww} 291`);wave.setAttribute('data-glitch',glitch&&!s.fix?'10':'0');wave.innerHTML=v;root.querySelector('[data-status]').textContent=(s.fix?'此单变量变化已由冗余项覆盖':glitch?'此变化方向出现毛刺':'此等延迟示例中，此方向无毛刺')+' · P、Q 为上、下支路输出';root.querySelector('[data-kind]').value=s.kind;root.querySelector('[data-direction]').value=s.direction;root.querySelector('input').checked=s.fix;}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);for(const k of ['kind','direction'])root.querySelector('[data-'+k+']').onchange=e=>{s[k]=e.target.value;draw();save();};root.querySelector('input').onchange=e=>{s.fix=e.target.checked;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
