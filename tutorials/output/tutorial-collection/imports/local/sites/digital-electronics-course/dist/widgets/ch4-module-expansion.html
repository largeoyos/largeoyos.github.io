<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-module-expansion")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-module-expansion",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-module-expansion">
<div class="viz-controls"><label class="form-label">扩展电路<select class="form-select" data-mode=""><option value="decoder">两片 138：4 线—16 线译码</option><option value="encoder">两片 148：16 线—4 线编码</option></select></label><label class="form-label">编号 / 地址 = <span data-v="">11</span><input class="form-range" data-n="" max="15" min="0" type="range" value="11"/></label></div>
<svg aria-label="利用使能端实现编码器和译码器扩展" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-module-expansion svg{display:block;width:100%;color:var(--foreground)}#ch4-module-expansion svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-module-expansion svg .small{font-size:12px}#ch4-module-expansion .wire{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}#ch4-module-expansion .hot{stroke:var(--viz-series-1);stroke-width:2.4}</style>
<script>
  (()=>{const root=document.getElementById('ch4-module-expansion'),svg=root.querySelector('svg');let s={mode:'decoder',n:11};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`,box=(x,y,w,h,name)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`+t(x+w/2,y+26,name,'middle'),bub=(x,y)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`;
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['decoder','encoder'].includes(v.mode))s.mode=v.mode;if(Number.isInteger(v.n)&&v.n>=0&&v.n<16)s.n=v.n;}}
  function draw(){const w=svg.clientWidth||320,m=w/2,x=m-66,hi=s.n>>3,lo=s.n&7;let o='<title>组合模块扩展</title><desc>译码器共享低三位地址，最高位控制两片的使能，分别输出零到七和八到十五。编码器上组有请求时禁止下组，上组三位反码与下组三位反码逐位送入与非门，形成正码输出。本图编码器每次设置一个请求编号。</desc>',h=500,status='';
  if(s.mode==='decoder'){o+=t(m,20,'D₃D₂D₁D₀ = '+s.n.toString(2).padStart(4,'0'),'middle')+t(9,49,'D₂:D₀','start',true)+p(`M 36 58 V 298 H ${x} M 36 112 H ${x}`)+t(42,97,'/3','start',true)+box(x,73,132,126,'74HC138 · 低组')+box(x,260,132,126,'74HC138 · 高组');o+=t(m,124,'A₂:A₀ = '+lo.toString(2).padStart(3,'0'),'middle',true)+t(m,151,'S₁=1 · S₃′=0','middle',true)+t(m,177,'S₂′ ← D₃','middle',true)+t(m,311,'A₂:A₀ = '+lo.toString(2).padStart(3,'0'),'middle',true)+t(m,338,'S₂′=S₃′=0','middle',true)+t(m,364,'S₁ ← D₃','middle',true);o+=t(w-10,49,'D₃ = '+hi,'end')+p(`M ${w-20} 58 V 360 H ${x+132} M ${w-20} 173 H ${x+140}`)+bub(x+136,173)+t(w-12,223,hi?'全部为 1':`Z${lo}′=0`,'end',true)+t(w-12,412,hi?`Z${8+lo}′=0`:'全部为 1','end',true);o+=p(`M ${m} 199 V 218`)+p(`M ${m} 386 V 406`)+t(m,237,'Z₀′…Z₇′','middle',true)+t(m,431,'Z₈′…Z₁₅′','middle',true);status=`只使能${hi?'高组':'低组'} · Z${s.n}′ = 0，其余输出为 1`;
  }else{h=570;const hc=hi?7-lo:7,lc=hi?7:7-lo,ys=hi?1:0,ex=hi?0:1;o+=t(m,20,'有效请求 A'+s.n+'′ = 0','middle')+box(x,49,132,110,'74HC148 · 高组')+t(m,100,'A₈′…A₁₅′','middle',true)+t(m,128,'S′ = 0','middle',true)+box(x,267,132,110,'74HC148 · 低组')+t(m,318,'A₀′…A₇′','middle',true)+t(m,346,'S′ = '+ys,'middle',true);o+=t(w-24,185,'YS′ = '+ys,'end',true)+p(`M ${x+132} 131 H ${w-15} V 342 H ${x+140}`)+bub(x+136,342);o+=p(`M ${x} 107 H 25 V 200`)+t(35,182,'YEX′='+ex,'start',true)+`<path d="M 16 200 H 34 L 25 220 Z" fill="var(--background)" stroke="currentColor"/>`+bub(25,224)+p('M 25 228 V 248')+t(8,265,'Z₃='+hi,'start',true);o+=p(`M ${m-25} 159 V 188 H ${x-20} V 455 H ${m-60}`)+t(m-18,184,hc.toString(2).padStart(3,'0'),'start',true)+p(`M ${m+25} 377 V 410 H ${m+80} V 455 H ${m+60}`)+t(m+35,401,lc.toString(2).padStart(3,'0'),'start',true)+box(m-60,434,120,48,'逐位 NAND')+t(m-50,420,'/3','start',true)+t(m+50,420,'/3','start',true)+p(`M ${m} 482 V 515`)+t(m,540,'Z₂Z₁Z₀ = '+lo.toString(2).padStart(3,'0'),'middle');status=`正码输出 Z₃Z₂Z₁Z₀ = ${s.n.toString(2).padStart(4,'0')} · 下组${hi?'禁止编码':'允许编码'}`;}
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('data-output',s.n);svg.innerHTML=o;root.querySelector('[data-status]').textContent=status;root.querySelector('[data-mode]').value=s.mode;root.querySelector('[data-n]').value=s.n;root.querySelector('[data-v]').textContent=s.n;}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelector('select').onchange=e=>{s.mode=e.target.value;draw();save();};root.querySelector('input').oninput=e=>{s.n=+e.target.value;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
