<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-multiplexer-design")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-multiplexer-design",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-multiplexer-design">
<div class="viz-controls"><label class="form-label">接线方案<select class="form-select" data-mode=""><option value="traffic">4 选 1：交通灯故障</option><option value="ex18">4 选 1：题 4.18</option><option value="eight">8 选 1：例 4.5.5</option><option value="vote">8 选 1：两种表决规则</option><option value="demux">138：1 路分配到 8 路</option></select></label><button class="btn" data-bit="a" type="button">A</button><button class="btn" data-bit="b" type="button">B</button><button class="btn" data-bit="c" type="button">C</button><button class="btn" data-bit="t" type="button">T</button><label class="form-check" data-enable-label=""><input checked="" class="form-check-input" data-enable="" type="checkbox"/><span class="form-check-label">使能 S′=0</span></label></div>
<svg aria-label="四选一和八选一数据选择器的函数实现接线" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-multiplexer-design [hidden]{display:none!important}#ch4-multiplexer-design svg{display:block;width:100%;color:var(--foreground)}#ch4-multiplexer-design svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-multiplexer-design svg .small{font-size:12px}#ch4-multiplexer-design .wire{fill:none;stroke:currentColor;stroke-width:1.5}#ch4-multiplexer-design .hot{stroke:var(--viz-series-1);stroke-width:2.5}</style>
<script>
  (()=>{const root=document.getElementById('ch4-multiplexer-design'),svg=root.querySelector('svg');let s={mode:'demux',a:1,b:0,c:1,t:1,enable:true};const text=(x,y,t,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${t}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`;
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(['traffic','ex18','eight','vote','demux'].includes(v.mode))s.mode=v.mode;for(const k of ['a','b','c','t'])if(v[k]===0||v[k]===1)s[k]=v[k];if(typeof v.enable==='boolean')s.enable=v.enable;}}
  function draw(){const w=svg.clientWidth||320,eight=['eight','vote'].includes(s.mode),n=eight?8:4,left=105,right=w-80,y0=82,dy=36,bh=n*dy+20;let vals,labels,address,addrName,names;
  if(s.mode==='traffic'){names={a:'R',b:'A',c:'G',t:'T'};vals=[1-s.a,s.a,s.a,1];labels=['R′','R','R','1'];address=2*s.b+s.c;addrName=`A₁ = A = ${s.b} · A₀ = G = ${s.c}`;}
  if(s.mode==='ex18'){names={a:'A',b:'B',c:'C',t:'T'};vals=[1-s.c,1,1-s.c,s.c];labels=['C′','1','C′','C'];address=2*s.a+s.b;addrName=`A₁ = A = ${s.a} · A₀ = B = ${s.b}`;}
  if(s.mode==='eight'){names={a:'A',b:'B',c:'C',t:'T'};vals=[1,0,0,1,0,1,0,1];labels=vals.map(String);address=4*s.a+2*s.b+s.c;addrName=`A₂A₁A₀ = ABC = ${address.toString(2).padStart(3,'0')}`;}
  if(s.mode==='vote'){names={a:'P',b:'Q',c:'R',t:'T'};vals=[0,0,0,1-s.t,0,1-s.t,1-s.t,1];labels=['0','0','0','T′','0','T′','T′','1'];address=4*s.a+2*s.b+s.c;addrName=`A₂A₁A₀ = PQR = ${address.toString(2).padStart(3,'0')}`;}
  let f,cy,h,o,status;root.querySelector('[data-enable-label]').hidden=s.mode==='demux';
  if(s.mode==='demux'){address=4*s.a+2*s.b+s.c;names={a:'A₂',b:'A₁',c:'A₀',t:'D'};f=1-s.t;cy=90+36*address;h=474;const l=74,r=w-94;o='<title>74HC138 数据分配器</title><desc>数据 D 接高有效使能 S1，两个低有效使能接零。地址选中的输出是 D 的反相，其余输出保持一。</desc>'+text(w/2,20,'74HC138 · 数据分配','middle')+text(w/2,46,'A₂A₁A₀ = '+address.toString(2).padStart(3,'0'),'middle',true)+p(`M ${w/2} 52 V 64`)+`<rect x="${l}" y="64" width="${r-l}" height="332" fill="none" stroke="currentColor"/>`+text(8,199,'D='+s.t)+p(`M 8 215 H ${l}`)+text(l+7,209,'S₁','start',true)+p(`M ${l} 215 H ${l+34} V ${cy} H ${r}`,true);for(let i=0;i<8;i++){const y=90+36*i,v=i===address?1-s.t:1;o+=`<circle cx="${r+4}" cy="${y}" r="4" fill="var(--background)" stroke="currentColor"/>`+p(`M ${r+8} ${y} H ${w-8}`,i===address)+text(w-8,y-9,`Y${i}′=${v}`,'end',true);}for(const x of [w/2-20,w/2+20])o+=`<circle cx="${x}" cy="400" r="4" fill="var(--background)" stroke="currentColor"/>`+p(`M ${x} 404 V 429`);o+=p(`M ${w/2-20} 429 H ${w/2+20}`)+text(w/2,453,'S₂′ = S₃′ = 0','middle',true);status=`地址 ${address}：D=${s.t} → Y${address}′=${f}，其余输出为 1`;
  }else{f=s.enable?vals[address]:0;cy=y0+address*dy;h=y0+bh+92;o='<title>数据选择器接线与通路</title><desc>数据端旁标注实际接入的变量或常量。地址决定选中的数据端；高亮线表示完整的选中通路。禁止工作时 Y 为零，W 为一，不是高阻态。</desc>'+text(w/2,20,eight?'74HC151 · 8 选 1':'½ 74HC153 · 4 选 1','middle')+text(w/2,47,addrName,'middle',true)+p(`M ${(left+right)/2} 53 V ${y0-20}`)+`<rect x="${left}" y="${y0-20}" width="${right-left}" height="${bh+20}" fill="none" stroke="currentColor" stroke-width="1.6"/>`;
    for(let i=0;i<n;i++){const y=y0+i*dy;o+=text(4,y-7,labels[i]+' = '+vals[i])+p(`M 4 ${y} H ${left}`,s.enable&&i===address)+text(left+9,y-7,'D'+i,'start',true);}
    const oy=y0+bh/2-10;if(s.enable)o+=p(`M ${left} ${cy} H ${right-35} V ${oy} H ${right}`,true);o+=p(`M ${right} ${oy} H ${w-8}`,s.enable)+text(w-9,oy-12,'Y = '+f,'end');
    o+=text(left+10,y0+bh+46,'S′ = '+(+!s.enable),'start',true)+`<circle cx="${left+30}" cy="${y0+bh+4}" r="4" fill="var(--background)" stroke="currentColor"/>`+p(`M ${left+30} ${y0+bh+8} V ${y0+bh+28}`);if(eight)o+=p(`M ${right} ${oy} H ${right-15} V ${oy+42} H ${right}`)+`<circle cx="${right+4}" cy="${oy+42}" r="4" fill="var(--background)" stroke="currentColor"/>`+p(`M ${right+8} ${oy+42} H ${w-8}`)+text(w-9,oy+62,'W = '+(1-f),'end',true);status=s.enable?`地址 ${address} → D${address} → Y = ${f}`:'禁止工作 · Y = 0';}
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('data-address',address);svg.setAttribute('data-output',f);svg.innerHTML=o;root.querySelector('select').value=s.mode;root.querySelector('input').checked=s.enable;root.querySelectorAll('[data-bit]').forEach(b=>{const k=b.dataset.bit;b.hidden=k==='t'&&!['vote','demux'].includes(s.mode);b.textContent=names[k]+' = '+s[k];b.setAttribute('aria-pressed',!!s[k]);});root.querySelector('[data-status]').textContent=status;}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{s[b.dataset.bit]^=1;draw();save();});root.querySelector('select').onchange=e=>{s.mode=e.target.value;draw();save();};root.querySelector('input').onchange=e=>{s.enable=e.target.checked;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
