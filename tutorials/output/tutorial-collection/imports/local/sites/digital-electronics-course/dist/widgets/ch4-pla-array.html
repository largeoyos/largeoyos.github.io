<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-pla-array")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-pla-array",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script></head><body><div id="ch4-pla-array">
<div class="viz-controls"><button class="btn" data-bit="a" type="button">A</button><button class="btn" data-bit="b" type="button">B</button><button class="btn" data-bit="c" type="button">C</button><label class="form-check"><input checked="" class="form-check-input" data-enable="" type="checkbox"/><span class="form-check-label">输出使能 OE′ = 0</span></label></div>
<svg aria-label="一个小型 PLA 的与阵列和或阵列" role="img"></svg><div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-pla-array svg{display:block;width:100%;color:var(--foreground)}#ch4-pla-array svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-pla-array svg .small{font-size:12px}#ch4-pla-array .wire{fill:none;stroke:currentColor;stroke-width:1.4}#ch4-pla-array .mark{stroke:var(--viz-series-1);stroke-width:2}</style>
<script>
  (()=>{const root=document.getElementById('ch4-pla-array'),svg=root.querySelector('svg');let s={a:1,b:1,c:0,enable:true};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=d=>`<path class="wire" d="${d}"/>`,cross=(x,y)=>`<path class="mark" d="M ${x-4} ${y-4} L ${x+4} ${y+4} M ${x-4} ${y+4} L ${x+4} ${y-4}"/>`;
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){for(const k of ['a','b','c'])if(v[k]===0||v[k]===1)s[k]=v[k];if(typeof v.enable==='boolean')s.enable=v.enable;}}
  function draw(){const w=svg.clientWidth||320,xs=[30,78,126,174],terms=[s.a&s.b,(1-s.a)&s.c,s.b&s.c],f=[terms[0]|terms[1],terms[0]|terms[2]],xg=w-99;let o='<title>PLA 编程连接示例</title><desc>叉号表示接通的可编程连接点。与阵列分别产生 AB、A 撇 C、BC 三个乘积项。或阵列把第一项和第二项相加得到 Y0，把第一项和第三项相加得到 Y1。输出被禁止时为高阻态 Z。</desc>'+t(8,20,'与阵列 · × 为接通点','start',true);
  ['A','A′','B','C'].forEach((v,i)=>{o+=t(xs[i],49,v,'middle')+p(`M ${xs[i]} 58 V 239`);});const connections=[[0,2],[1,3],[2,3]];
  for(let i=0;i<3;i++){const y=91+i*61;o+=p(`M 10 ${y} H ${xg}`);for(const k of connections[i])o+=cross(xs[k],y);o+=`<rect x="${xg}" y="${y-18}" width="32" height="36" fill="var(--background)" stroke="currentColor"/>`+t(xg+16,y+5,'&amp;','middle')+p(`M ${xg+32} ${y} H ${w-8}`)+t(w-8,y-10,'P'+i+'='+terms[i],'end',true);}
  o+=t(8,278,'或阵列 · 共享 P0','start',true);const px=[w*.16,w*.39,w*.62];for(let i=0;i<3;i++)o+=t(px[i],307,'P'+i,'middle')+p(`M ${px[i]} 316 V 442`);for(let i=0;i<2;i++){const y=350+i*69;o+=p(`M 10 ${y} H ${xg}`)+cross(px[0],y)+cross(px[i+1],y)+`<rect x="${xg}" y="${y-18}" width="32" height="36" fill="var(--background)" stroke="currentColor"/>`+t(xg+16,y+5,'≥1','middle')+p(`M ${xg+32} ${y} H ${xg+38}`)+`<path d="M ${xg+38} ${y-12} V ${y+12} L ${xg+56} ${y} Z" fill="var(--background)" stroke="currentColor"/><circle cx="${xg+44}" cy="${y+11}" r="3" fill="var(--background)" stroke="currentColor"/>`+p(`M ${xg+44} ${y+14} V ${y+27} M ${xg+56} ${y} H ${w-8}`)+t(xg+44,y+43,'OE′','middle',true)+t(w-8,y-23,'Y'+i+'='+(s.enable?f[i]:'Z'),'end',true);}
  o+=t(w/2,478,'三态输出缓冲：OE′ = '+(+!s.enable),'middle',true);svg.setAttribute('viewBox',`0 0 ${w} 498`);svg.setAttribute('data-outputs',s.enable?f.join(''):'ZZ');svg.innerHTML=o;root.querySelector('[data-status]').textContent=s.enable?`输出 Y0=${f[0]}，Y1=${f[1]}`:'输出缓冲被禁止 · Y0=Y1=Z';root.querySelector('[data-enable]').checked=s.enable;root.querySelectorAll('[data-bit]').forEach(b=>{b.textContent=b.dataset.bit.toUpperCase()+' = '+s[b.dataset.bit];b.setAttribute('aria-pressed',!!s[b.dataset.bit]);});}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{s[b.dataset.bit]^=1;draw();save();});root.querySelector('input').onchange=e=>{s.enable=e.target.checked;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
