<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-priority-encoder")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-priority-encoder",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-priority-encoder">
<div class="viz-controls"><label class="form-check"><input checked="" class="form-check-input" data-enable="" type="checkbox"/><span class="form-check-label">允许编码（S′ = 0）</span></label></div>
<div class="viz-row" data-requests=""></div>
<svg aria-label="74HC148 低电平输入、反码输出的优先编码器" role="img"></svg>
<div aria-live="polite" class="text-small" data-status=""></div>
<style>#ch4-priority-encoder svg{display:block;width:100%;color:var(--foreground)}#ch4-priority-encoder svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}#ch4-priority-encoder svg .small{font-size:12px}#ch4-priority-encoder .wire{fill:none;stroke:currentColor;stroke-width:1.6}#ch4-priority-encoder .hot{stroke:var(--viz-series-1);stroke-width:2.5}</style>
<script>
  (()=>{const root=document.getElementById('ch4-priority-encoder'),svg=root.querySelector('svg');let s={mask:36,enable:true};const t=(x,y,v,a='start',sm=false)=>`<text x="${x}" y="${y}" text-anchor="${a}"${sm?' class="small"':''}>${v}</text>`,p=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`,c=(x,y)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`;
  root.querySelector('[data-requests]').innerHTML=Array.from({length:8},(_,i)=>`<button class="btn" type="button" data-i="${i}" aria-pressed="false">I${i}′</button>`).join('');
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){if(Number.isInteger(v.mask)&&v.mask>=0&&v.mask<=255)s.mask=v.mask;if(typeof v.enable==='boolean')s.enable=v.enable;}}
  function draw(){let win=-1;if(s.enable)for(let i=0;i<8;i++)if(s.mask>>i&1)win=i;const code=win<0?7:7-win,ys=s.enable&&win<0?0:1,ex=s.enable&&win>=0?0:1,w=svg.clientWidth||320,bx=w/2-52,bw=104;let out='<title>74HC148 优先编码</title><desc>按下的输入按钮表示该输入引脚为零。七号优先权最高。输出是获胜编号的三位反码。选通输出 YS 撇在允许编码但无请求时为零，扩展输出 YEX 撇在允许编码且有请求时为零。</desc>';
  out+=`<rect x="${bx}" y="32" width="${bw}" height="290" fill="none" stroke="currentColor" stroke-width="1.5"/>`+t(w/2,21,'74HC148','middle');
  for(let i=0;i<8;i++){const y=56+i*29;out+=t(8,y+4,`I${i}′ = ${s.mask>>i&1?0:1}`)+p(`M 66 ${y} H ${bx-8}`,win===i)+c(bx-4,y)+t(bx+10,y+4,'I'+i,'start',true);}
  for(let i=2;i>=0;i--){const y=82+(2-i)*53,v=code>>i&1;out+=t(bx+bw-10,y+4,'Y'+i,'end',true)+c(bx+bw+4,y)+p(`M ${bx+bw+8} ${y} H ${w-10}`)+t(w-10,y-10,`Y${i}′ = ${v}`,'end');}
  out+=t(bx+12,305,'S','start',true)+c(bx-4,300)+p(`M 66 300 H ${bx-8}`)+t(8,304,'S′ = '+(+!s.enable));out+=t(w/2,352,`YS′ = ${ys}     YEX′ = ${ex}`,'middle');svg.setAttribute('viewBox',`0 0 ${w} 370`);svg.setAttribute('data-winner',win);svg.setAttribute('data-code',code);svg.setAttribute('data-ys',ys);svg.setAttribute('data-ex',ex);svg.innerHTML=out;root.querySelector('[data-enable]').checked=s.enable;root.querySelectorAll('[data-i]').forEach(b=>{const i=+b.dataset.i,on=!!(s.mask>>i&1);b.textContent=`I${i}′ = ${on?0:1}`;b.setAttribute('aria-pressed',on);});root.querySelector('[data-status]').textContent=!s.enable?'禁止编码 · 输出码 111':win<0?'没有请求 · 输出码 111':`获胜编号 ${win}（${win.toString(2).padStart(3,'0')}）· 引脚输出 ${code.toString(2).padStart(3,'0')}`;}
  function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}restore(window.openai?.widgetState);root.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{s.mask^=1<<+b.dataset.i;draw();save();});root.querySelector('[data-enable]').onchange=e=>{s.enable=e.target.checked;draw();save();};window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
