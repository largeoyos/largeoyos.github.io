<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>电路与波形图解</title><link href="../widget.css" rel="stylesheet"/><script>(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem("de-course-widget:ch4-traffic-design")||'null')}catch{}const host={widgetState:saved,setWidgetState(v){host.widgetState=v;try{localStorage.setItem("de-course-widget:ch4-traffic-design",JSON.stringify(v))}catch{}return Promise.resolve()}};window.openai=host;window.courseState=()=>host;})();</script><!-- collection-math:start --><link id="collection-math-css" rel="stylesheet" href="../../../../../../math/katex.min.css"><style id="collection-math-layout">main li,main p{overflow-wrap:anywhere}.collection-math-display,.collection-math-inline{position:relative}.collection-math-display{max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding-block:.3em}.collection-math-display>.katex-display{margin:.35em 0;text-align:inherit}.collection-math-inline{display:inline-block;max-width:100%;vertical-align:-.15em;overflow-x:auto;overflow-y:hidden;font-family:inherit;background:transparent!important;padding:0!important}.collection-math-inline>.katex{font-size:1.04em}.collection-math-svg{overflow:visible;pointer-events:none}.collection-math-svg .katex{font-size:1em}.eq:has(>.katex),.formula:has(>.katex){font-family:inherit}.katex-display>.katex{white-space:nowrap} .katex .katex-mathml{white-space:nowrap}</style><script defer src="../../../../../../math/katex.min.js"></script><script defer src="../../../../../../math/render.js"></script><!-- collection-math:end --></head><body><div id="ch4-traffic-design">
<div class="viz-controls"><button class="btn" data-bit="r" type="button">R</button><button class="btn" data-bit="a" type="button">A</button><button class="btn" data-bit="g" type="button">G</button><label class="form-label">实现方式<select class="form-select" data-kind=""><option value="andor">与门、或门</option><option value="nand">全部用与非门</option></select></label></div>
<svg aria-label="交通信号灯故障检测电路" class="circuit" role="img"></svg>
<div aria-live="polite" class="text-small" data-status=""></div>
<svg aria-label="故障函数的三变量卡诺图" class="kmap" role="img"></svg>
<style>
    #ch4-traffic-design svg{display:block;width:100%;color:var(--foreground)}
    #ch4-traffic-design svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}
    #ch4-traffic-design svg .small{font-size:12px}
    #ch4-traffic-design .wire{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
    #ch4-traffic-design .hot{stroke:var(--viz-series-1);stroke-width:2.4}
    #ch4-traffic-design .group{fill:none;stroke:var(--viz-series-1);stroke-width:1.5}
  </style>
<script>
  (()=>{const root=document.getElementById('ch4-traffic-design'),svg=root.querySelector('.circuit'),km=root.querySelector('.kmap');let s={r:0,a:0,g:0,kind:'andor'};
  const text=(x,y,t,anchor='start',small=false)=>`<text x="${x}" y="${y}" text-anchor="${anchor}"${small?' class="small"':''}>${t}</text>`;
  const wire=(d,on=false)=>`<path class="wire${on?' hot':''}" d="${d}"/>`;
  const bubble=(x,y)=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`;
  function gate(x,y,w,h,label,nand){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--background)" stroke="currentColor" stroke-width="1.5"/>`+text(x+w/2,y+h/2+5,label,'middle')+(nand?bubble(x+w+4,y+h/2):'');}
  function restore(v){v=v&&(v.privateContent||v.modelContent);if(v){for(const k of ['r','a','g'])if(v[k]===0||v[k]===1)s[k]=v[k];if(['andor','nand'].includes(v.kind))s.kind=v.kind;}}
  function draw(){const w=svg.clientWidth||320,n=s.kind==='nand',x=92,gx=w-90,vals=[s.r&&s.a,s.r&&s.g,s.a&&s.g,!s.r&&!s.a&&!s.g].map(Number),z=+vals.some(Boolean),labels=[['R','A'],['R','G'],['A','G'],['R′','A′','G′']];let out='<title>交通灯故障检测</title><desc>四个乘积项分别送到最后一级门。方框内与符号为与门，大于等于一为或门，小圆圈表示取反。带撇号的输入由反相器产生。</desc>';
  for(let i=0;i<4;i++){const y=26+i*88,cy=y+26,yy=122+i*18;labels[i].forEach((label,j)=>{const iy=cy+(labels[i].length===3?(j-1)*22:(j-.5)*22);out+=text(6,iy+4,label)+wire(`M 36 ${iy} H ${x}`);});out+=gate(x,y,48,52,'&amp;',n)+wire(`M ${x+48+(n?8:0)} ${cy} H ${gx-18-i*7} V ${yy} H ${gx}`,!!(n?!vals[i]:vals[i]));out+=text(x+56,cy-8,String(n?1-vals[i]:vals[i]),'start',true);}
  out+=gate(gx,106,48,96,n?'&amp;':'≥1',n)+wire(`M ${gx+48+(n?8:0)} 154 H ${w-8}`,!!z)+text(w-8,96,'Z = '+z,'end');out+=text(6,372,'反变量 R′、A′、G′ 由非门提供', 'start',true);svg.setAttribute('viewBox',`0 0 ${w} 387`);svg.setAttribute('data-output',z);svg.innerHTML=out;
  root.querySelectorAll('[data-bit]').forEach(b=>{b.textContent=b.dataset.bit.toUpperCase()+' = '+s[b.dataset.bit];b.setAttribute('aria-pressed',!!s[b.dataset.bit]);});root.querySelector('[data-kind]').value=s.kind;root.querySelector('[data-status]').textContent=z?'故障：全灭或至少两灯同时亮':'正常：恰好一灯亮';
  const kw=km.clientWidth||320,cw=(kw-58)/4,x0=45,y0=58,ch=49,gray=[0,1,3,2];let k='<title>故障函数卡诺图</title><desc>列按照格雷码零零、零一、一一、一零排列。框线分别覆盖 RA、RG、AG，孤立的全零格单独成项。</desc>'+text(6,17,'卡诺图 · 圈 1', 'start',true)+text(6,43,'R / AG', 'start',true);
  for(let j=0;j<4;j++)k+=text(x0+cw*(j+.5),44,gray[j].toString(2).padStart(2,'0'),'middle',true);
  for(let r=0;r<2;r++){k+=text(22,y0+ch*(r+.5)+5,r,'middle');for(let j=0;j<4;j++){const a=gray[j]>>1,g=gray[j]&1,v=+(r+a+g!==1);k+=`<rect x="${x0+j*cw}" y="${y0+r*ch}" width="${cw}" height="${ch}" fill="${r===s.r&&a===s.a&&g===s.g?'var(--accent)':'none'}" stroke="var(--border)"/>`+text(x0+cw*(j+.5),y0+ch*(r+.5)+5,v,'middle');}}
  k+=`<rect class="group" x="${x0+2*cw+3}" y="${y0+ch+4}" width="${2*cw-6}" height="${ch-8}" rx="12"/><rect class="group" x="${x0+cw+7}" y="${y0+ch+8}" width="${2*cw-14}" height="${ch-16}" rx="12"/><rect class="group" x="${x0+2*cw+11}" y="${y0+4}" width="${cw-22}" height="${2*ch-8}" rx="12"/><rect class="group" x="${x0+5}" y="${y0+5}" width="${cw-10}" height="${ch-10}" rx="12"/>`;
  km.setAttribute('viewBox',`0 0 ${kw} 169`);km.innerHTML=k;}
  restore(window.openai?.widgetState);root.querySelectorAll('[data-bit]').forEach(b=>b.onclick=()=>{s[b.dataset.bit]^=1;draw();save();});root.querySelector('select').onchange=e=>{s.kind=e.target.value;draw();save();};function save(){window.openai?.setWidgetState({modelContent:s,privateContent:s}).catch(()=>{});}window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});new ResizeObserver(draw).observe(root);draw();})();
  </script>
</div>
<script>(()=>{let last=0;const report=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'de-course-height',height:h},'*')}};new ResizeObserver(report).observe(document.body);window.addEventListener('load',report);report();})();</script></body></html>
